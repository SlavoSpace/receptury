body{margin:0}
.rx{--tlo:#F3F6F4;--pow:#FFFFFF;--pow2:#FAFCFB;--pow3:#EEF3F0;--wybrany:#E6F3EA;--linia:#DCE4DF;--ramka:#D3DDD7;--ramka2:#C2CFC8;--tekst:#13201A;--tekst2:#4B5D53;--tekst3:#5F7067;--akcja:#0F7A39;--naAkcji:#FFFFFF;--moc:#1E63B5;--aktywny:#13201A;--naAktywnym:#FFFFFF;--nieaktywny:#3B4C43;--okTlo:#E6F5EC;--okRamka:#8CCBA3;--okTekst:#145C33;--uwTlo:#FFF4DE;--uwRamka:#E3BE73;--uwTekst:#7A4700;--blTlo:#FDECEC;--blRamka:#EBB4B4;--blTekst:#9E1C1C;--mocTlo:#E2EDFB;--mocRamka:#93B6E6;--mocTekst:#1C4F8F;--mRec:#B4472F;color-scheme:light}
.rx.ciemny{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--moc:#7CC0FF;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--mRec:#FF9A80;color-scheme:dark}
.rx *{box-sizing:border-box}
.rx button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
.rx button:active{filter:brightness(.94)}
.rx input{font:inherit;color:var(--tekst);outline:none}
.rx input::placeholder{color:var(--tekst3)}
.rx input:focus{border-color:var(--moc)}
.rx :focus-visible{outline:3px solid var(--moc);outline-offset:2px}
.rx .hov:hover{background:var(--pow3)}
.rx .lista::-webkit-scrollbar{width:8px}
.rx .lista::-webkit-scrollbar-thumb{background:var(--ramka2);border-radius:4px}
a{color:#1C4F8F}a:hover{color:#13201A}
.rx .lancuch{--g:12px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--g);align-items:stretch}
.rx .kafel-l{position:relative;min-width:0;min-height:116px;padding:11px 12px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;text-align:left}
.rx .k-et{display:block;max-width:100%;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx .k-li{display:block;font-size:26px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.rx .k-kod{display:block;margin-top:auto;font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;font-weight:600;line-height:1.2}
.rx .k-op{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;font-size:12px;font-weight:600;line-height:1.25}
.rx .strz{position:absolute;right:calc(-1 * var(--g));top:50%;width:var(--g);margin-top:-11px;text-align:center;color:var(--tekst3);font-weight:800;font-size:16px;line-height:22px}
.rx .oa-linia{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:1359px){.rx .gora{grid-template-columns:minmax(0,1fr) !important}}
@media (max-width:939px){.rx .lancuch{--g:8px}.rx .oa-linia{gap:8px}.rx .kafel-l{padding:9px 8px 8px;min-height:106px}.rx .k-et{font-size:10px;letter-spacing:.04em}.rx .k-li{font-size:22px}.rx .k-kod,.rx .k-op{font-size:11px}}
@media (max-width:759px){.rx .lancuch{grid-template-columns:repeat(7,112px);overflow-x:auto;padding-bottom:6px}}
@media (max-width:860px){
.rx .uklad{grid-template-columns:minmax(0,1fr) !important}
.rx .lista{max-height:380px !important}
}
@media (max-width:759px){.rx .oa-linia{display:none !important}}
@media (max-width:560px){.rx .kto-tekst{display:none !important}.rx .kto{padding:0 5px !important}}
.rx .plik{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;opacity:0}
@media (max-width:600px){
.rx .wiersz,.rx .wnag{grid-template-columns:minmax(0,1fr) 84px 44px !important}
.rx .wnazwa{grid-column:1 / -1}
.rx .wnag .wn{display:none}
.rx .rwiersz{grid-template-columns:minmax(0,1fr) 96px 84px !important}
.rx .rna1{display:none !important}
.rx .tytul{font-size:20px !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="szablon">
<div class="rx {{motyw}}" style="min-height: 100vh; background: var(--tlo); color: var(--tekst); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-height: 60px; padding: 8px 16px 8px 20px; border-bottom: 1px solid var(--linia); background: var(--tlo)">
    <div style="display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0">
      <svg width="30" height="30" viewBox="0 0 32 32" role="img" aria-label="Receptury" fill="none" stroke="var(--mRec)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 11h20"></path>
        <path d="M8 11c0 4 3.6 6.5 8 6.5s8-2.5 8-6.5"></path>
        <path d="M16 17.5v3.5"></path>
        <path d="M7.5 21h17l1.5 7h-20z"></path>
        <circle cx="16" cy="24.5" r="1.2" fill="var(--mRec)" stroke="none"></circle>
      </svg>
      <h1 style="margin: 0; font-family: 'Bebas Neue', 'Avenir Next Condensed', 'Roboto Condensed', 'Arial Narrow', Inter, sans-serif; font-weight: 400; letter-spacing: 0.05em; line-height: 1; font-size: 30px; padding-top: 3px; white-space: nowrap">RECEPTURY</h1>
      <sc-if value="{{nag.maChip}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--uwRamka); background: var(--uwTlo); color: var(--uwTekst); white-space: nowrap">{{nag.chip}}</span>
      </sc-if>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto">
      <button type="button" aria-label="Jak czytać receptury" onClick="{{pokazPomoc}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 11px">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: var(--mocTlo); border: 1.5px solid var(--mocRamka); color: var(--mocTekst); font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center">?</span>
      </button>
      <button type="button" aria-label="{{motywEtykieta}}" onClick="{{zmienMotyw}}" style="width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--ramka); background: var(--pow); color: var(--tekst2); display: flex; align-items: center; justify-content: center">
        <sc-if value="{{jasny}}" hint-placeholder-val="{{true}}">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
        </sc-if>
        <sc-if value="{{ciemny}}" hint-placeholder-val="{{false}}">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
      </button>
      <sc-if value="{{nag.maInfo}}" hint-placeholder-val="{{false}}">
        <a class="info-i" href="{{nag.info}}" target="_blank" rel="noopener" aria-label="Instrukcja receptury.dysza.app (PDF)" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #2f74c0; color: #ffffff; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; text-decoration: none">i</a>
      </sc-if>
      <div class="kto" style="height: 44px; padding: 0 12px 0 6px; border-radius: 11px; border: 1px solid var(--ramka); background: var(--pow); display: flex; align-items: center; gap: 8px">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: var(--pow3); border: 2px solid var(--mRec); color: var(--mRec); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800">{{nag.inicjaly}}</span>
        <span class="kto-tekst" style="display: flex; flex-direction: column; line-height: 1.15">
          <span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{nag.imie}}</span>
          <span style="font-size: 11px; font-weight: 600; color: var(--tekst3); white-space: nowrap">{{nag.rola}}</span>
        </span>
      </div>
      <sc-if value="{{nag.mozeWyloguj}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-label="Wyloguj" onClick="{{nag.wyloguj}}" style="width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--ramka); background: var(--pow); color: var(--tekst2); display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5M5 12h11"></path></svg>
        </button>
      </sc-if>
    </div>
  </header>

  <main style="max-width: 1440px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px">

    <sc-if value="{{pomoc}}" hint-placeholder-val="{{false}}">
      <section aria-label="Jak czytać receptury" style="padding: 16px 18px; border-radius: 16px; background: var(--pow); border: 1px solid var(--mocRamka); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800">Jak czytać receptury</h2>
          <button type="button" onClick="{{zamknijPomoc}}" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--ramka2); font-size: 13.5px; font-weight: 700">Zamknij</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
          <div style="padding: 10px 12px; border-radius: 12px; background: var(--pow2); border: 1px solid var(--linia); font-size: 13.5px"><strong>Towar</strong> — pozycja z FIRMINO w jednostce zakupu: kilogram, opakowanie, karton.</div>
          <div style="padding: 10px 12px; border-radius: 12px; background: var(--pow2); border: 1px solid var(--linia); font-size: 13.5px"><strong>Surowiec</strong> — towar gotowy do receptur: przelicznik na g, ml albo szt. i wydajność po obróbce (łosoś 65%).</div>
          <div style="padding: 10px 12px; border-radius: 12px; background: var(--pow2); border: 1px solid var(--linia); font-size: 13.5px"><strong>Półprodukt</strong> — partia: składniki i ile z niej wychodzi, w g, ml albo szt. (1 kg suchego ryżu daje 2,3 kg ryżu do sushi; wywar liczymy w ml).</div>
          <div style="padding: 10px 12px; border-radius: 12px; background: var(--pow2); border: 1px solid var(--linia); font-size: 13.5px"><strong>Produkt</strong> — rolka albo danie na 1 szt.: gramatury i liczba kawałków.</div>
          <div style="padding: 10px 12px; border-radius: 12px; background: var(--pow2); border: 1px solid var(--linia); font-size: 13.5px"><strong>Zestaw</strong> — wszystko, co sprzedajemy: produkty, gratis do wyboru klienta i dodatki; pojedyncza rolka, napój czy sos to zestaw z jednym produktem. Wydawany jako paczka (z opakowaniami) albo talerz (stolik).</div>
          <div style="padding: 10px 12px; border-radius: 12px; background: var(--pow2); border: 1px solid var(--linia); font-size: 13.5px"><strong>Wersje</strong> — zapis zmiany tworzy nową wersję od jutra; zużycie za minione dni liczy się według wersji, która wtedy obowiązywała.</div>
        </div>
      </section>
    </sc-if>

    <div class="gora" style="display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: stretch">
      <section aria-label="ZDZISŁAW" style="display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 8px; border-radius: 16px; background: var(--pow); border: 1px solid var(--ramka); min-width: 0">
        <img src="zdzislaw-kucharz.png" alt="ZDZISŁAW jako kucharz w dużej czapce nasuniętej na czoło: chochla w jednej ręce, klasyczna waga szalkowa w drugiej" style="width: 124px; height: auto; flex: 0 0 auto; display: block">
        <div style="position: relative; flex: 1 1 auto; min-width: 0; background: #1D1D1D; color: #E8F3EC; border: 2px solid #9FE3B4; border-radius: 14px; padding: 10px 12px 11px; font-size: 13.5px; line-height: 1.38; font-weight: 600">
          <span aria-hidden="true" style="position: absolute; left: -8px; top: 50%; width: 12px; height: 12px; margin-top: -6px; background: #1D1D1D; border-left: 2px solid #9FE3B4; border-bottom: 2px solid #9FE3B4; transform: rotate(45deg)"></span>
          <span style="display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.09em; color: #9FE3B4; margin-bottom: 3px">ZDZISŁAW · KUCHARZ</span>
          <span style="display: block">{{zdz}}</span>
        </div>
      </section>

      <section aria-label="Droga produktu" style="padding: 12px 14px 10px; border-radius: 16px; background: var(--pow2); border: 1px solid var(--ramka); display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--tekst3)">Droga produktu · od FIRMINO do klienta</span>
          <span style="font-size: 12px; color: var(--tekst3)">dotknij poziomu</span>
        </div>
        <div class="lancuch">
          <sc-for list="{{poziomy}}" as="p" hint-placeholder-count="7">
            <button type="button" class="kafel-l" aria-current="{{p.ac}}" onClick="{{p.idz}}" style="box-sizing: border-box; {{p.styl}}">
              <span class="k-et">{{p.etykieta}}</span>
              <span class="k-li">{{p.liczba}}</span>
              <span class="k-kod">{{p.kod}}</span>
              <span class="k-op" style="box-sizing: border-box; {{p.opisStyl}}">{{p.opis}}</span>
              <sc-if value="{{p.maZnak}}" hint-placeholder-val="{{true}}">
                <span class="strz" aria-hidden="true">{{p.znak}}</span>
              </sc-if>
            </button>
          </sc-for>
        </div>
        <div class="oa-linia">
          <button type="button" onClick="{{oa.idz}}" class="hov" style="grid-column: 1 / 7; min-height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 6px; border-radius: 8px; color: var(--tekst3); font-size: 12px; font-weight: 700">
            <span style="flex: 0 0 auto; padding: 2px 8px; border-radius: 7px; border: 1px dashed var(--ramka2)">OA · {{oa.liczba}} opakowań</span>
            <span aria-hidden="true" style="flex: 1 1 auto; height: 0; border-top: 2px dashed var(--ramka2)"></span>
            <span style="flex: 0 0 auto">prosto do paczki ↗</span>
          </button>
        </div>
      </section>
    </div>

    <div class="uklad" style="display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start">

      <section aria-label="Lista" style="background: var(--pow); border: 1px solid var(--ramka); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0">
        <div style="padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--linia)">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
            <div style="min-width: 0">
              <h2 style="margin: 0; font-size: 16px; font-weight: 800">{{lista.tytul}}</h2>
              <p style="margin: 2px 0 0; font-size: 12.5px; color: var(--tekst3)">{{lista.opis}}</p>
            </div>
            <sc-if value="{{lista.mozeNowy}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{lista.nowy}}" style="flex: 0 0 auto; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--ramka2); font-size: 13.5px; font-weight: 700; white-space: nowrap">{{lista.nowyEtykieta}}</button>
            </sc-if>
            <sc-if value="{{lista.mozeWgrac}}" hint-placeholder-val="{{false}}">
              <label class="hov" style="position: relative; flex: 0 0 auto; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--ramka2); font-size: 13.5px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; cursor: pointer">{{lista.wgrajEtykieta}}<input class="plik" type="file" accept=".csv,text/csv" aria-label="Plik eksportu Produkty z FIRMINO" onChange="{{lista.wgraj}}"></label>
            </sc-if>
          </div>
          <sc-if value="{{lista.maPytanie}}" hint-placeholder-val="{{false}}">
            <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--uwTlo); border: 1px solid var(--uwRamka); color: var(--uwTekst)">
              <span style="font-size: 13.5px; font-weight: 600">{{lista.pytanie}}</span>
              <div style="display: flex; gap: 8px; justify-content: flex-end">
                <button type="button" onClick="{{lista.nie}}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--uwRamka); font-size: 14px; font-weight: 700">Anuluj</button>
                <button type="button" onClick="{{lista.tak}}" style="min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--akcja); color: var(--naAkcji); font-size: 14.5px; font-weight: 800">{{lista.takEtykieta}}</button>
              </div>
            </div>
          </sc-if>
          <input type="search" aria-label="Szukaj kodu lub nazwy" placeholder="Szukaj kodu lub nazwy" autocomplete="off" value="{{szukaj}}" onChange="{{ustawSzukaj}}" style="width: 100%; min-height: 44px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--ramka2); background: var(--pow2); font-size: 15px">
          <sc-if value="{{lista.maFiltry}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 11px; background: var(--pow2); border: 1px solid var(--ramka)">
              <sc-for list="{{lista.filtry}}" as="f" hint-placeholder-count="4">
                <button type="button" aria-pressed="{{f.wl}}" onClick="{{f.wybierz}}" style="box-sizing: border-box; {{f.styl}}">{{f.etykieta}} <span style="font-variant-numeric: tabular-nums; opacity: 0.75">{{f.liczba}}</span></button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div class="lista" style="max-height: 640px; overflow-y: auto; -webkit-overflow-scrolling: touch">
          <sc-for list="{{lista.wiersze}}" as="w" hint-placeholder-count="8">
            <button type="button" aria-current="{{w.ac}}" onClick="{{w.wybierz}}" class="hov" style="box-sizing: border-box; {{w.styl}}">
              <span style="display: flex; flex-direction: column; min-width: 0">
                <span style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; font-weight: 600; color: var(--tekst3)">{{w.kod}}</span>
                <span style="font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{w.nazwa}}</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
                <span style="font-size: 12.5px; font-weight: 600; color: var(--tekst2); white-space: nowrap; font-variant-numeric: tabular-nums">{{w.meta}}</span>
                <sc-if value="{{w.maPig}}" hint-placeholder-val="{{false}}">
                  <span style="display: inline-flex; {{w.pig.styl}}">{{w.pig.tekst}}</span>
                </sc-if>
              </span>
            </button>
          </sc-for>
          <sc-if value="{{lista.pusta}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; padding: 22px 14px; font-size: 14px; color: var(--tekst3)">Nic nie pasuje do wyszukiwania.</p>
          </sc-if>
        </div>
        <div style="padding: 9px 14px; border-top: 1px solid var(--linia); font-size: 12px; color: var(--tekst3)">{{lista.licznik}}</div>
      </section>

      <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">

        <sc-if value="{{d.nic}}" hint-placeholder-val="{{false}}">
          <section style="padding: 28px 18px; border-radius: 16px; background: var(--pow); border: 1px solid var(--ramka); color: var(--tekst3); font-size: 15px">Wybierz pozycję z listy po lewej.</section>
        </sc-if>

        <sc-if value="{{d.jest}}" hint-placeholder-val="{{true}}">

    function awatar(o, kl) {

    }
    function htmlInna() {          // „+ Inna osoba · Інша особа” — druga część (po ukraińsku) mniejsza, w drugiej linii

    }
    function htmlKafelki() {
      var os = osoby();
      var k = os.map(function (o) {
        var imie = o.imie || o.login;
        return '<div class="dw-kafel-w"><button type="button" class="dw-kafel" data-dw="osoba" data-v="' + esc(o.login) + '" data-test="osoba-' + esc(o.login) + '"' + (S.edycja ? ' disabled' : '') + '>' +
          awatar(o) + '<span class="dw-kafel-imie">' + esc(imie) + '</span>' +
          '<span class="dw-kafel-rola">' + (o.podpis ? esc(o.podpis) : '<span class="dw-mono">' + esc(o.login) + '</span>') + (o.ua ? '<span class="dw-znacznik">UA</span>' : '') + '</span></button>' +
          (S.edycja ? '<button type="button" class="dw-kafel-x" data-dw="zapomnij" data-v="' + esc(o.login) + '" aria-label="Usuń ' + esc(imie) + ' z tego urządzenia">×</button>' : '') + '</div>';
      }).join('');
      return '<div class="dw-uklad"><div>' +
        (K.edycja && K.zapomnij
          ? '<div class="dw-rzad"><span class="dw-etykieta">' + T(K.kto) + '</span><button type="button" class="dw-link dw-link-maly" data-dw="edycja" data-test="edytuj-liste">' + (S.edycja ? 'Gotowe' : 'Edytuj listę') + '</button></div>'
          : '<div><span class="dw-etykieta">' + T(K.kto) + '</span></div>') +
        htmlWiad() + '<div class="dw-kafelki">' + k + (S.edycja ? '' : '<button type="button" class="dw-kafel dw-kafel-inna" data-dw="inna" data-test="inna-osoba">' + htmlInna() + '</button>') + '</div>' +
        (S.edycja ? '<p class="dw-uwaga">Usunięcie kafelka nie usuwa konta — osoba zaloguje się znowu przez „Inna osoba”.</p>' : '') +
        '</div>' + htmlZdz(K.zdzKafelki) + '</div>';
    }
    function htmlLogin() {
      return '<div class="dw-uklad"><form class="dw-form" data-dw-form="login" autocomplete="off" novalidate>' + htmlWiad() +
        '<div class="dw-pole"><label class="dw-etykieta" for="' + id('login') + '">' + T(K.etykietaLogin) + '</label>' +
        '<input id="' + id('login') + '" data-dw-pole="login" data-test="login" type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" enterkeyhint="next" placeholder="' + esc(K.placeholder) + '" value="' + esc(S.login) + '">' +
        '<span class="dw-pomoc">' + TL(K.pomoc) + '</span>' +
        '<span class="dw-blad" role="alert" data-test="blad-loginu"' + (S.blad ? '' : ' hidden') + '>' + esc(S.blad) + '</span></div>' +
        '<button type="submit" class="dw-glowny" data-test="dalej">' + T(K.dalej) + '</button>' +
        (osoby().length ? '<button type="button" class="dw-link" data-dw="kafelki" data-test="do-kafelkow">' + ik('wstecz', 'dw-mala') + ' Wróć do kafelków</button>' : '') +
        '</form>' + htmlZdz(K.zdzLogin) + '</div>';
    }
    function htmlKropki() {
      var ile = Math.min(Math.max(dlZnana() || 6, S.pin.length), K.maxPin), h = '';
      for (var i = 0; i < ile; i++) h += '<span class="' + (i < S.pin.length ? 'dw-p' : '') + '"></span>';
      return h;
    }
    function komunikat() {
      if (S.wysyla) return { r: 'czeka', kl: '', t: S.otwiera ? 'Otwieram…' : 'Sprawdzam…' };
      if (S.czekaDo > Date.now() && S.blad) return { r: 'blad', kl: ' dw-pin-blad', t: S.blad, alert: true };   // serwer podał godzinę
      var lok = lokalnaMs();
      if (lok > 0) return { r: 'blad', kl: ' dw-pin-blad', t: 'Za dużo prób — spróbuj za ' + Math.max(1, Math.ceil(lok / 1000)) + ' s', alert: true };
      if (S.blad) return { r: 'blad', kl: ' dw-pin-blad', t: S.blad, alert: true };
      if (S.info) return { r: 'info', kl: S.infoRodzaj === 'uwaga' ? ' dw-pin-uwaga' : ' dw-pin-ok', t: S.info };
      var dl = dlZnana();
      return { r: 'zwykly', kl: '', t: dl ? 'PIN ma ' + dl + ' cyfr.' : K.podpowiedzPin };
    }
    function htmlPin() {
      var o = S.osoba, imie = o.imie || o.login, zab = zablokowanyMs() > 0, wyl = (S.wysyla || zab) ? ' disabled' : '';
      var klaw = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (n) {
        return '<button type="button" class="dw-kl" data-dw="cyfra" data-v="' + n + '" data-test="pin-' + n + '"' + wyl + '>' + n + '</button>';
      }).join('') +
        '<button type="button" class="dw-kl dw-maly" data-dw="cofnij" data-test="pin-cofnij" aria-label="Usuń cyfrę"' + (S.wysyla ? ' disabled' : '') + '>⌫</button>' +
        '<button type="button" class="dw-kl" data-dw="cyfra" data-v="0" data-test="pin-0"' + wyl + '>0</button>' +
        '<button type="button" class="dw-kl dw-ok-kl" data-dw="pin-ok" data-test="pin-zaloguj" aria-label="Zaloguj"' + (S.pin.length >= 6 && !S.wysyla && !zab ? '' : ' disabled') + '>' + ik('ok') + '</button>';
      var km = komunikat(), notka = '';
      if (K.notkaPin) { try { notka = K.notkaPin(o) || ''; } catch (e) { notka = ''; } }
      return '<div class="dw-pin-uklad"><div class="dw-pin' + (S.wysyla ? ' dw-wysyla' : '') + '" data-dw-pin>' +
        awatar(o, 'dw-duzy') +
        '<div class="dw-pin-imie" data-test="pin-osoba">' + esc(imie) + '</div>' +
        '<div class="dw-pin-pod">' + (o.imie && String(o.imie).toLowerCase() !== String(o.login).toLowerCase() ? '<span class="dw-mono">' + esc(o.login) + '</span> · ' : '') + T(K.wpiszPin) + '</div>' +
        '<div class="dw-kropki" data-dw-kropki aria-live="polite" aria-label="Wpisano ' + S.pin.length + ' cyfr">' + htmlKropki() + '</div>' +
        '<div class="dw-pin-hint' + km.kl + '" data-dw-komunikat data-test="pin-komunikat" data-rodzaj="' + km.r + '"' + (km.alert ? ' role="alert"' : ' role="status"') + '>' + T(km.t) + '</div>' +
        '<div class="dw-klaw" data-dw-klaw>' + klaw + '</div>' +
        '<div class="dw-pin-linki"><button type="button" class="dw-link" data-dw="wroc" data-test="pin-wroc">' + ik('wstecz', 'dw-mala') + ' Inna osoba</button>' +
        (K.prosba ? '<button type="button" class="dw-link" data-dw="prosba" data-test="pin-prosba">Nie pamiętam PIN-u</button>' : '') + '</div>' +
        (notka ? '<div class="dw-pin-notka">' + T(notka) + '</div>' : '') +
        '</div><div class="dw-pin-zdz">' + zdz('tyl', 'ZDZISŁAW stoi tyłem — widać ważkę na głowie i baterię atomową') + '<p>' + T(K.zdzPin) + '</p></div></div>';
    }
    function html() {
      var tresc = S.krok === 'pin' && S.osoba ? htmlPin() : (S.krok === 'login' || !osoby().length ? htmlLogin() : htmlKafelki());
      return '<div class="dw-w">' +
        '<div class="dw-gora"><div><h1 class="dw-logo dw-bebas">' + esc(K.nazwa) + '</h1>' +
        '<span class="dw-pod' + (K.pokaz ? ' dw-pokaz' : '') + '">' + T(K.opis) + '</span></div>' + htmlMotyw() + '</div>' +
        tresc +
        (K.link && K.link.tekst ? '<a class="dw-dolny" href="' + esc(K.link.href || '#') + '" data-test="link-dolny">' + T(K.link.tekst) + '</a>' : '') +
        '</div>';
    }

    /* ───────────── rysowanie ───────────── */
    function rysuj() {
      if (!root) return;
      var a = document.activeElement, bylFokusLoginu = a && a.getAttribute && a.getAttribute('data-dw-pole') === 'login' && root.contains(a);
      root.className = 'dw ' + (motyw() === 'jasny' ? 'dw-jasny' : 'dw-ciemny');
      root.setAttribute('data-modul', K.modul);
      root.setAttribute('data-krok', S.krok === 'pin' && S.osoba ? 'pin' : (S.krok === 'login' || !osoby().length ? 'login' : 'kafelki'));
      root.innerHTML = html();
      if (root.getAttribute('data-krok') === 'login') {
        var i = root.querySelector('[data-dw-pole="login"]');
        if (i && (bylFokusLoginu || !S.blad)) setTimeout(function () { if (S.widoczny && i.isConnected && document.activeElement !== i) { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } } }, 30);
      }
      zaplanujOdliczanie();
    }
    /* PIN: przy każdej cyfrze odświeżamy tylko kropki, komunikat i klawisze — ZDZISŁAW nie miga od nowa */
    function odswiezPin() {
      if (!root || root.getAttribute('data-krok') !== 'pin') { rysuj(); return; }
      var pin = root.querySelector('[data-dw-pin]'), kr = root.querySelector('[data-dw-kropki]'), km = root.querySelector('[data-dw-komunikat]');
      if (!pin || !kr || !km) { rysuj(); return; }
      pin.classList.toggle('dw-wysyla', !!S.wysyla);
      kr.innerHTML = htmlKropki(); kr.setAttribute('aria-label', 'Wpisano ' + S.pin.length + ' cyfr');
      var k = komunikat();
      km.className = 'dw-pin-hint' + k.kl; km.setAttribute('role', k.alert ? 'alert' : 'status'); km.setAttribute('data-rodzaj', k.r); km.innerHTML = T(k.t);
      var zab = zablokowanyMs() > 0;
      Array.prototype.forEach.call(root.querySelectorAll('[data-dw="cyfra"]'), function (b) { b.disabled = !!(S.wysyla || zab); });
      var c = root.querySelector('[data-dw="cofnij"]'); if (c) c.disabled = !!S.wysyla;
      var ok = root.querySelector('[data-dw="pin-ok"]'); if (ok) ok.disabled = !(S.pin.length >= 6 && !S.wysyla && !zab);
      zaplanujOdliczanie();
    }
    function zaplanujOdliczanie() {
      clearTimeout(odliczT);
      if (!S.widoczny || S.krok !== 'pin') return;
      if (lokalnaMs() > 0) { S.byloOdliczanie = true; odliczT = setTimeout(odswiezPin, 1000); }
      else if (S.byloOdliczanie) { S.byloOdliczanie = false; S.blad = ''; odliczT = setTimeout(odswiezPin, 0); }   // po minucie — czysto, bez starego błędu
    }
    function potrzasnij() {
      var p = root && root.querySelector('[data-dw-pin]');
      if (!p) return;
      p.classList.remove('dw-potrzasnij'); void p.offsetWidth; p.classList.add('dw-potrzasnij');
    }
    function zaplanujMrug() {
      clearTimeout(mrugT);
      if (!S.widoczny || !OBRAZY.powitanie_mrug) return;
      mrugT = setTimeout(function () {
        if (root) Array.prototype.forEach.call(root.querySelectorAll('[data-dw-poza="powitanie"] img'), function (z) {
          z.src = OBRAZY.powitanie_mrug;
          setTimeout(function () { if (z.isConnected) z.src = OBRAZY.powitanie; }, 150);
        });
        zaplanujMrug();
      }, 3200 + Math.random() * 3800);
    }

    /* ───────────── kroki ───────────── */
    function doPinu(o) {
      S.wiad = null;
      S.osoba = o; S.krok = 'pin'; S.pin = ''; S.blad = ''; S.info = ''; S.poBledzie = false; S.wysyla = false; S.otwiera = false;
      rysuj();
    }
    function doStartu() {
      S.osoba = null; S.pin = ''; S.blad = ''; S.info = ''; S.wysyla = false; S.otwiera = false; S.edycja = false;
      S.krok = osoby().length ? 'kafelki' : 'login';
      rysuj();
    }
    function dalejZLoginu() {
      var l = S.login.trim();
      if (!l) { S.blad = 'Wpisz login.'; rysuj(); return; }
      if (!/^[A-Za-z0-9][A-Za-z0-9._@+-]{1,39}$/.test(l)) { S.blad = 'Login to litery i cyfry (stare loginy także z kropką).'; rysuj(); return; }
      var z = osoby().filter(function (x) { return String(x.login).toLowerCase() === l.toLowerCase(); })[0];
      S.blad = '';
      doPinu(z || { login: l, imie: l, dl: 0 });
    }
    function cyfra(c) {
      if (S.krok !== 'pin' || S.wysyla || zablokowanyMs() > 0 || S.pin.length >= K.maxPin) return;
      S.pin += c; S.blad = ''; S.info = '';
      var dl = dlZnana();
      if (dl && S.pin.length === dl) { wyslij(); return; }
      odswiezPin();
    }
    function cofnij() { if (S.wysyla) return; S.pin = S.pin.slice(0, -1); odswiezPin(); }
    function wyslij() {
      if (S.wysyla || !S.osoba) return;
      if (zablokowanyMs() > 0) { odswiezPin(); return; }
      if (S.pin.length < 6) { S.blad = 'PIN ma co najmniej 6 cyfr.'; odswiezPin(); potrzasnij(); return; }
      if (!K.zaloguj) { S.blad = 'Logowanie nie jest podłączone.'; odswiezPin(); return; }
      var pin = S.pin, osoba = S.osoba;
      S.wysyla = true; S.blad = ''; S.info = ''; odswiezPin();
      Promise.resolve().then(function () { return K.zaloguj(osoba, pin); }).then(function () {
        S.pin = ''; S.otwiera = true;            // moduł zwykle już schował okno; jeśli nie — „Otwieram…”
        if (S.widoczny && S.krok === 'pin') odswiezPin();
      }, function (e) {
        S.wysyla = false; S.otwiera = false; S.pin = ''; S.poBledzie = true;
        S.blad = (e && e.message) || 'Nie udało się zalogować.';
        if (e && e.status === 429) {
          var dt = e.czeka_do ? new Date(e.czeka_do).getTime() - Date.now() : 60e3;
          if (!(dt > 0)) dt = 60e3;
          S.czekaDo = Date.now() + Math.min(Math.max(dt, 1000), 16 * 60e3);
          clearTimeout(czekaT);
          czekaT = setTimeout(function () { S.czekaDo = 0; if (S.widoczny && S.krok === 'pin') { S.blad = ''; odswiezPin(); } }, S.czekaDo - Date.now());
        }
        if (S.widoczny) { if (S.krok === 'pin') { odswiezPin(); potrzasnij(); } }
      });
    }
    function prosba() {
      if (!K.prosba || !S.osoba || S.wysyla) return;
      S.blad = ''; S.info = 'Wysyłam prośbę…'; S.infoRodzaj = 'ok'; odswiezPin();
      Promise.resolve().then(function () { return K.prosba(S.osoba.login); }).then(function () {
        S.info = 'Prośba wysłana. Kierownik zobaczy ją w managerze — nowy PIN dostaniesz osobiście.'; odswiezPin();
      }, function (e) {
        S.info = ''; S.blad = (e && e.message) || 'Nie udało się wysłać prośby — spróbuj za chwilę.'; odswiezPin();
      });
    }

    /* ───────────── zdarzenia ───────────── */
    var AKCJE = {
      motyw: function (el) {
        var m = el.getAttribute('data-v') === 'jasny' ? 'jasny' : 'ciemny';
        try { K.ustawMotyw(m); } catch (e) { /* moduł bez motywu */ }
        root.className = 'dw ' + (motyw() === 'jasny' ? 'dw-jasny' : 'dw-ciemny');
        Array.prototype.forEach.call(root.querySelectorAll('[data-dw="motyw"]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === motyw())); });
      },
      osoba: function (el) { var v = el.getAttribute('data-v'); var o = osoby().filter(function (x) { return x.login === v; })[0]; if (o) doPinu(o); },
      inna: function () { S.krok = 'login'; S.login = ''; S.blad = ''; S.wiad = null; rysuj(); },
      kafelki: function () { S.krok = 'kafelki'; S.blad = ''; rysuj(); },
      edycja: function () { S.edycja = !S.edycja; rysuj(); },
      zapomnij: function (el) {
        if (!K.zapomnij) return;
        try { K.zapomnij(el.getAttribute('data-v')); } catch (e) { /* zostaje na liście */ }
        if (!osoby().length) { S.edycja = false; S.krok = 'login'; }
        rysuj();
      },
      cyfra: function (el) { cyfra(el.getAttribute('data-v')); },
      cofnij: cofnij,
      'pin-ok': wyslij,
      wroc: doStartu,
      prosba: prosba
    };
    function naKlik(e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-dw]') : null;
      if (!el || !root.contains(el) || el.disabled) return;
      var a = AKCJE[el.getAttribute('data-dw')];
      if (a) { e.preventDefault(); a(el); }
    }
    function naWyslanie(e) {
      if (e.target && e.target.getAttribute && e.target.getAttribute('data-dw-form') === 'login') { e.preventDefault(); dalejZLoginu(); }
    }
    function naWpis(e) {
      var t = e.target;
      if (!t || !t.getAttribute || t.getAttribute('data-dw-pole') !== 'login') return;
      var v = t.value.replace(/\s/g, '');
      if (v !== t.value) t.value = v;
      S.login = v;
      if (S.blad) { S.blad = ''; var b = root.querySelector('[data-test="blad-loginu"]'); if (b) { b.textContent = ''; b.hidden = true; } }
    }
    function naKlawisz(e) {
      if (!S.widoczny || S.krok !== 'pin' || !S.osoba || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (/^\d$/.test(e.key)) { e.preventDefault(); cyfra(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); cofnij(); }
      else if (e.key === 'Enter') { e.preventDefault(); wyslij(); }
      else if (e.key === 'Escape') { e.preventDefault(); doStartu(); }
    }

    function zbudujRoot() {
      if (root) return;
      wstawCss();
      root = document.createElement('div');
      root.className = 'dw dw-ciemny';
      root.id = 'dysza-wejscie' + (nr > 1 ? '-' + nr : '');
      if (K.zIndex != null) root.style.zIndex = String(K.zIndex);   // np. pod okienkami i dymkami modułu
      root.hidden = true;
      root.addEventListener('click', naKlik);
      root.addEventListener('submit', naWyslanie);
      root.addEventListener('input', naWpis);
      document.body.appendChild(root);
    }

    var API = {
      wersja: WERSJA,
      /* opcje: { krok: 'kafelki'|'login'|'pin', osoba: {login, imie, dl, …}, komunikat: 'tekst', rodzaj: 'blad'|'uwaga'|'info'|'ok' }
         — komunikat na PIN-ie: pomarańczowy (uwaga) albo zielony (ok); na kafelkach i przy loginie: czerwony (blad), pomarańczowy, szary (info) */
      pokaz: function (opcje) {
        opcje = opcje || {};
        zbudujRoot();
        var czekaDo = S.czekaDo;                   // blokada z serwera trwa także po powrocie do okna
        S = nowyStan(); S.czekaDo = czekaDo;
        if (opcje.krok === 'pin' && opcje.osoba && opcje.osoba.login) { S.krok = 'pin'; S.osoba = opcje.osoba; }
        else if (opcje.krok === 'login' || !osoby().length) S.krok = 'login';
        else S.krok = 'kafelki';
        if (opcje.komunikat) {
          if (S.krok === 'pin') { S.info = String(opcje.komunikat); S.infoRodzaj = opcje.rodzaj === 'ok' ? 'ok' : 'uwaga'; }
          else S.wiad = { t: String(opcje.komunikat), r: opcje.rodzaj || 'blad' };      // rodzaj: 'blad' | 'uwaga' | 'info'
        }
        if (opcje.login) S.login = String(opcje.login);
        S.widoczny = true;
        root.hidden = false;
        document.addEventListener('keydown', naKlawisz);
        rysuj();
        zaplanujMrug();
        try { root.scrollTop = 0; } catch (e) { /* stare przeglądarki */ }
        return API;
      },
      ukryj: function () {
        S.widoczny = false;
        clearTimeout(mrugT); clearTimeout(odliczT);
        document.removeEventListener('keydown', naKlawisz);
        if (root) { root.hidden = true; root.innerHTML = ''; }
        return API;
      },
      odswiez: function () { if (S.widoczny) { if (S.krok === 'pin') odswiezPin(); else rysuj(); } return API; },
      widoczne: function () { return !!S.widoczny; },
      ustaw: function (zmiany) { for (var z in (zmiany || {})) K[z] = zmiany[z]; if (S.widoczny) rysuj(); return API; },
      zniszcz: function () {
        API.ukryj();
        if (root) {
          root.removeEventListener('click', naKlik); root.removeEventListener('submit', naWyslanie); root.removeEventListener('input', naWpis);
          if (root.parentNode) root.parentNode.removeChild(root);
          root = null;
        }
      },
      _stan: function () { return S; }
    };
    return API;
  }

  window.DyszaWejscie = { wersja: WERSJA, utworz: utworz };
})();
</script>
<script>

      (z.pacz || []).forEach((w) => this.licz(P, w.k, w.ile * np, nom, 1));
      (z.tal || []).forEach((w) => this.licz(P, w.k, w.ile * nt, nom, 1));
    });
    return nom;
  }

  masa(P, k, m) {
    if (m[k] !== undefined) return m[k];
    const it = P[k];
    let g = 0;
    if (!it) g = 0;
    else if (it.poz === 'OA') g = 0;
    else if (it.poz === 'SUR') g = it.jedn === 'szt' ? (it.g1 || 0) : 1;
    else if (it.poz === 'POL') g = it.jedn === 'szt' ? (it.g1 || 0) : 1;
    else {
      m[k] = 0;
      (it.s || []).forEach((w) => {
        if (w.wyb) { const n = w.opc.length || 1; w.opc.forEach((o) => { g += w.ile / n * this.masa(P, o, m); }); } else g += w.ile * this.masa(P, w.k, m);
      });
    }
    m[k] = g;
    return g;
  }

  kawalki(P, k) {
    const it = P[k];
    if (!it) return { baza: 0, gratis: 0 };
    if (it.poz === 'PRO') return { baza: it.kaw || 0, gratis: 0 };
    let baza = 0; let gratis = 0;
    (it.s || []).forEach((w) => {
      if (w.wyb) {
        const n = w.opc.length || 1;
        let s = 0;
        w.opc.forEach((o) => { s += (P[o] && P[o].poz === 'PRO' ? P[o].kaw || 0 : 0); });
        gratis += w.ile * s / n;
      } else if (P[w.k] && P[w.k].poz === 'PRO') baza += w.ile * (P[w.k].kaw || 0);
    });
    return { baza, gratis };
  }

  alergeny(P, k, m, gl) {
    if (m[k]) return m[k];
    const it = P[k];
    let s = [];
    if (it && this.bazowe(it)) s = it.alg || [];
    else if (it && (gl || 0) < 25) {
      m[k] = [];
      (it.s || []).forEach((w) => {
        (w.wyb ? w.opc : [w.k]).forEach((kk) => { s = s.concat(this.alergeny(P, kk, m, (gl || 0) + 1)); });
      });
    }
    s = this.ALG_KOL.filter((a) => s.indexOf(a) >= 0);
    m[k] = s;
    return s;
  }

  alergenyPelne(P, k, wariant, m) {
    let s = this.alergeny(P, k, m, 0);
    this.dodatki(P[k], wariant).forEach((w) => { s = s.concat(this.alergeny(P, w.k, m, 1)); });
    return this.ALG_KOL.filter((a) => s.indexOf(a) >= 0);
  }

  zawiera(P, a, b, gl) {
    if (a === b) return true;
    const it = P[a];
    if (!it || !it.s || (gl || 0) > 25) return false;
    return it.s.some((w) => (w.wyb ? w.opc : [w.k]).some((o) => this.zawiera(P, o, b, (gl || 0) + 1)));
  }

  uzycia(P, k) {
    const wyn = [];
    Object.keys(P).forEach((pk) => {
      const it = P[pk];
      if (this.bazowe(it)) return;
      [['s', it.s], ['pacz', it.pacz], ['tal', it.tal]].forEach((para) => {
        (para[1] || []).forEach((w) => {
          if (w.wyb ? w.opc.indexOf(k) >= 0 : w.k === k) wyn.push({ kod: pk, lista: para[0], ile: w.wyb ? w.ile / (w.opc.length || 1) : w.ile, wyb: !!w.wyb });
        });
      });
    });
    return wyn;
  }

  statusSur(it) {
    if (it.zero) return 'woda';
    const t = this.TM[it.tow];
    if (!t || !(t.cena > 0)) return 'cen';
    if (!(it.prz > 0)) return 'uzu';
    if (it.zr === 'przyklad') return 'prz';
    return 'got';
  }

  jednostkaKosztu(it, z) {
    if (it.jedn === 'g') return this.zl(z * 1000) + ' / kg';
    if (it.jedn === 'ml') return this.zl(z * 1000) + ' / l';
    return this.zl(z) + ' / szt.';
  }

  /* ─────────── zmiany ─────────── */
  zmienPoz(kod, fn, txt) {
    const s = this.state;
    const P = Object.assign({}, s.P);
    const it = this.kopia(P[kod]);
    fn(it);
    P[kod] = it;
    const zm = Object.assign({}, s.zm);
    zm[kod] = true;
    const nowy = { P, zm };
    if (txt) nowy.txt = Object.assign({}, s.txt, txt);
    this.setState(nowy);
  }

  ustawTekst(klucz, raw) {
    this.setState({ txt: Object.assign({}, this.state.txt, { [klucz]: raw }) });
  }

  poleLiczbowe(kod, pole, raw, min) {
    const v = this.liczba(raw);
    const klucz = kod + '|' + pole;
    if (v === null || (min !== undefined && v < min)) { this.ustawTekst(klucz, raw); return; }
    this.zmienPoz(kod, (it) => { it[pole] = v; }, { [klucz]: raw });
  }

  ustawIle(kod, lista, id, raw) {
    const v = this.liczba(raw);
    const klucz = kod + '|' + lista + '|' + id;
    if (v === null) { this.ustawTekst(klucz, raw); return; }
    this.zmienPoz(kod, (it) => { it[lista].forEach((w) => { if (w.id === id) w.ile = v; }); }, { [klucz]: raw });
  }

  usun(kod, lista, id) {
    this.zmienPoz(kod, (it) => { it[lista] = it[lista].filter((w) => w.id !== id); });
  }

  dodaj(kod, lista, ck) {
    const s = this.state;
    const c = s.P[ck];
    const ile = !c ? 1 : c.poz === 'PRO' ? 1 : c.poz === 'OA' ? 1 : c.jedn === 'szt' ? 1 : 10;
    const id = s.nId + 1;
    const P = Object.assign({}, s.P);
    const it = this.kopia(P[kod]);
    it[lista] = (it[lista] || []).concat([{ id, k: ck, ile }]);
    P[kod] = it;
    this.setState({ P, nId: id, zm: Object.assign({}, s.zm, { [kod]: true }), pk: null });
  }

  // wybór klienta (np. gratis +6 do wyboru z trzech rolek): grupa opcji w składzie zestawu, koszt liczony średnio (decyzja z 18.11)
  dodajWybor(kod) {
    const s = this.state;
    const id = (s.nId || 0) + 1;
    const P = Object.assign({}, s.P);
    const it = this.kopia(P[kod]);
    it.s = (it.s || []).concat([{ id, wyb: 'Gratis · wybór klienta', ile: 1, opc: [] }]);
    P[kod] = it;
    this.setState({ P, nId: id, zm: Object.assign({}, s.zm, { [kod]: true }), pk: { lista: 's', szukaj: '', grupa: id } });
  }

  dodajOpcje(kod, lista, gid, k) {
    this.zmienPoz(kod, (it) => { (it[lista] || []).forEach((w) => { if (w.id === gid && w.opc.indexOf(k) < 0) w.opc = w.opc.concat([k]); }); });
  }

  usunOpcje(kod, lista, gid, k) {
    this.zmienPoz(kod, (it) => { (it[lista] || []).forEach((w) => { if (w.id === gid) w.opc = w.opc.filter((x) => x !== k); }); });
  }

  ustawNazweWyboru(kod, lista, gid, raw) {
    this.zmienPoz(kod, (it) => { (it[lista] || []).forEach((w) => { if (w.id === gid) w.wyb = raw; }); }, { [kod + '|wyb|' + gid]: raw });
  }

  zapisz(kod) {
    const s = this.state;
    const w = s.wer[kod] || { nr: s.P[kod] && s.P[kod].nowy ? 0 : 1, od: '18.11.2026', hist: [] };
    const nw = { nr: w.nr + 1, od: this.jutro(), hist: w.nr > 0 ? w.hist.concat([{ nr: w.nr, od: w.od }]) : [] };
    const P = Object.assign({}, s.P);
    const it = this.kopia(P[kod]);
    delete it.nowy;
    P[kod] = it;
    this.setState({ P, wer: Object.assign({}, s.wer, { [kod]: nw }), zap: Object.assign({}, s.zap, { [kod]: this.kopia(it) }), zm: Object.assign({}, s.zm, { [kod]: false }) });
  }

  odrzuc(kod) {
    const s = this.state;
    const P = Object.assign({}, s.P);
    if (s.zap[kod]) P[kod] = this.kopia(s.zap[kod]);
    const txt = Object.assign({}, s.txt);
    Object.keys(txt).forEach((k) => { if (k.indexOf(kod + '|') === 0) delete txt[k]; });
    this.setState({ P, txt, zm: Object.assign({}, s.zm, { [kod]: false }) });
  }

  nowy(poz) {
    const s = this.state;
    let nr = 0;
    Object.keys(s.P).forEach((k) => { if (k.indexOf(poz + '-') === 0) nr = Math.max(nr, Number(k.slice(poz.length + 1)) || 0); });
    const kod = poz + '-' + String(nr + 1).padStart(3, '0');
    const it = poz === 'POL' ? { kod, poz, nazwa: 'Nowy półprodukt', jedn: 'g', wych: 1000, g1: null, s: [], nowy: true }
      : poz === 'PRO' ? { kod, poz, nazwa: 'Nowy produkt', kaw: 8, s: [], nowy: true }
        : { kod, poz: 'ZES', nazwa: 'NOWY ZESTAW', dysza: null, cena: null, moc: null, n30: 0, n30t: 0, sklep: true, tablet: true, s: [], pacz: [], tal: [], nowy: true };
    const P = Object.assign({}, s.P, { [kod]: it });
    const wyb = Object.assign({}, s.wyb, { [poz]: kod });
    if (poz === 'ZES') { wyb.PACZ = kod; wyb.TAL = kod; }
    this.setState({ P, wyb, poziom: poz, szukaj: '', zap: Object.assign({}, s.zap, { [kod]: this.kopia(it) }), zm: Object.assign({}, s.zm, { [kod]: true }), wer: Object.assign({}, s.wer, { [kod]: { nr: 0, od: '', hist: [] } }), pk: { lista: 's', szukaj: '' }, hist: [] });
  }

  // ZESTAW z jednym produktem: tak pojedyncza rolka, napój albo sos trafia do sklepu i na tablet (decyzja z 18.11, sprawa S36)
  jedenProdukt(z) {
    if (!z || z.poz !== 'ZES') return null;
    const s = z.s || [];
    if (s.some((w) => w.wyb)) return null;
    const pro = s.filter((w) => this.state.P[w.k] && this.state.P[w.k].poz === 'PRO');
    return pro.length === 1 && pro[0].ile === 1 ? pro[0].k : null;
  }

  zestawyZ(kodPro) {
    const P = this.state.P;
    return Object.keys(P).filter((k) => P[k].poz === 'ZES' && this.jedenProdukt(P[k]) === kodPro);
  }

  nowyZestawZ(kodPro) {
    const s = this.state;
    const pr = s.P[kodPro];
    if (!pr) return;
    let nr = 0;
    Object.keys(s.P).forEach((k) => { if (k.indexOf('ZES-') === 0) nr = Math.max(nr, Number(k.slice(4)) || 0); });
    const kod = 'ZES-' + String(nr + 1).padStart(3, '0');
    const id = (s.nId || 0) + 1;
    const it = { kod, poz: 'ZES', nazwa: pr.nazwa.toUpperCase(), dysza: null, cena: null, moc: null, n30: 0, n30t: 0, sklep: true, tablet: true, s: [{ id, k: kodPro, ile: 1 }], pacz: [], tal: [], nowy: true };
    const P = Object.assign({}, s.P, { [kod]: it });
    const wyb = Object.assign({}, s.wyb, { ZES: kod, PACZ: kod, TAL: kod });
    const hist = s.hist.concat([{ poz: s.poziom, kod: s.wyb[s.poziom] }]).slice(-20);
    this.setState({ P, wyb, poziom: 'ZES', szukaj: '', nId: id, hist, pk: null, zap: Object.assign({}, s.zap, { [kod]: this.kopia(it) }), zm: Object.assign({}, s.zm, { [kod]: true }), wer: Object.assign({}, s.wer, { [kod]: { nr: 0, od: '', hist: [] } }) });
  }

  idz(poz, kod, zHistoria) {
    const s = this.state;
    const wyb = Object.assign({}, s.wyb);
    if (kod) {
      wyb[poz] = kod;
      if (poz === 'ZES' || poz === 'PACZ' || poz === 'TAL') { wyb.ZES = kod; wyb.PACZ = kod; wyb.TAL = kod; }
    }
    const hist = zHistoria ? s.hist.concat([{ poz: s.poziom, kod: s.wyb[s.poziom] }]).slice(-20) : (poz === s.poziom ? s.hist : []);
    this.setState({ poziom: poz, wyb, hist, pk: null, szukaj: poz === s.poziom ? s.szukaj : '' });
  }

  idzDoPozycji(kod) {
    const it = this.state.P[kod];
    if (!it) return;
    if (it.poz === 'OA') { this.setState({ filtr: Object.assign({}, this.state.filtr, { TOW: 'wsz' }) }); this.idz('TOW', kod, true); return; }
    this.idz(it.poz, kod, true);
  }

  wroc() {
    const s = this.state;
    if (!s.hist.length) return;
    const h = s.hist[s.hist.length - 1];
    const wyb = Object.assign({}, s.wyb, { [h.poz]: h.kod });
    this.setState({ poziom: h.poz, wyb, hist: s.hist.slice(0, -1), pk: null, szukaj: '' });
  }

  /* ─────────── widok ─────────── */
  renderVals() {
    this.przygotuj();
    const s = (this.state && this.state.P) ? this.state : Object.assign({}, this.stanPoczatkowy(), this.state || {});
    const P = s.P;
    const mk = {}; const mm = {}; const ma = {};
    const nom = this.nominal30(P);
    const self = this;
    const PIG = {
      ok: 'background:var(--okTlo);border:1px solid var(--okRamka);color:var(--okTekst)',
      uw: 'background:var(--uwTlo);border:1px solid var(--uwRamka);color:var(--uwTekst)',
      bl: 'background:var(--blTlo);border:1px solid var(--blRamka);color:var(--blTekst)',
      moc: 'background:var(--mocTlo);border:1px solid var(--mocRamka);color:var(--mocTekst)',
      cicha: 'background:transparent;border:1px dashed var(--ramka2);color:var(--tekst3)'
    };
    const pig = (tekst, rodz) => ({ tekst, styl: 'display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;' + PIG[rodz] });

    const poz = s.poziom;

    });

    const kafelLancucha = (kl, etykieta, liczba, kod, opis, znak) => {

    ];
    const oa = { liczba: String(ile.OA), idz: () => { this.setState({ filtr: Object.assign({}, s.filtr, { TOW: 'oa' }) }); this.idz('TOW', null, false); } };

    /* ── lista ── */
    const q = this.norm(s.szukaj);
    const pasuje = (kod, nazwa) => !q || this.norm(kod + ' ' + this.kodW(kod) + ' ' + nazwa).indexOf(q) >= 0;
    const wybrany = s.wyb[poz];
    const wierszStyl = (wl) => 'width:100%;min-height:52px;padding:8px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:2px;text-align:left;border-top:1px solid var(--linia);' + (wl ? 'background:var(--wybrany)' : '');
    let wiersze = [];
    let filtry = [];
    let opisListy = '';
    let mozeNowy = false;

      const fl = s.filtr.TOW;

      const licz = { wsz: this.T.length, sur: 0, oa: 0, poza: 0 };

      filtry = [['wsz', 'Wszystkie'], ['sur', 'Surowce'], ['oa', 'Opakowania'], ['poza', 'Poza recepturą']].map((p) => ({ etykieta: p[1], liczba: String(licz[p[0]]), wl: fl === p[0], styl: segStyl(fl === p[0]), wybierz: () => this.setState({ filtr: Object.assign({}, s.filtr, { TOW: p[0] }) }) }));
      wiersze = this.T.filter((t) => (fl === 'wsz' || grupa(t) === fl) && pasuje(t.kod, t.nazwa)).map((t) => ({
        kod: t.kod, nazwa: t.nazwa, meta: t.cena > 0 ? this.zl(t.cena) + ' / ' + (this.JM[t.jm] || t.jm) : '—',
        maPig: !(t.cena > 0) || t.akt === false, pig: t.akt === false ? pig('nie ma w eksporcie', 'cicha') : !(t.cena > 0) ? pig('brak ceny', 'bl') : pig('', 'cicha'),
        wybierz: () => this.idz('TOW', t.kod, false), styl: wierszStyl(wybrany === t.kod), ac: wybrany === t.kod ? 'true' : 'false'
      }));
      opisListy = this.eksportOpis() + ' · ' + this.T.length + ' pozycji';
    } else if (poz === 'SUR') {
      const fl = s.filtr.SUR;
      const sur = Object.keys(P).filter((k) => P[k].poz === 'SUR' && k !== 'WODA').map((k) => P[k]);
      const algDo = (it) => !it.zero && !it.algOk;
      const wFiltrze = (it, f) => (f === 'wsz' ? true : f === 'alg' ? algDo(it) : this.statusSur(it) === f);
      const licz = { wsz: sur.length, got: 0, prz: 0, uzu: 0, cen: 0, alg: 0 };
      sur.forEach((it) => { licz[this.statusSur(it)] += 1; if (algDo(it)) licz.alg += 1; });
      filtry = [['wsz', 'Wszystkie'], ['got', 'Gotowe'], ['prz', 'Przykład'], ['uzu', 'Do uzupełnienia'], ['cen', 'Bez ceny'], ['alg', 'Alergeny do potw.']]
        .filter((p) => p[0] === 'wsz' || p[0] === fl || licz[p[0]] > 0)
        .map((p) => ({ etykieta: p[1], liczba: String(licz[p[0]]), wl: fl === p[0], styl: segStyl(fl === p[0]), wybierz: () => this.setState({ filtr: Object.assign({}, s.filtr, { SUR: p[0] }) }) }));
      const PS = { got: null, prz: ['przykład', 'moc'], uzu: ['do uzupełnienia', 'uw'], cen: ['brak ceny', 'bl'] };
      wiersze = sur.filter((it) => wFiltrze(it, fl) && pasuje(it.kod, it.nazwa)).map((it) => {

          maPig: !!PS[st], pig: PS[st] ? pig(PS[st][0], PS[st][1]) : pig('', 'cicha'),
          wybierz: () => this.idz('SUR', it.kod, false), styl: wierszStyl(wybrany === it.kod), ac: wybrany === it.kod ? 'true' : 'false'
        };
      });

    } else {
      const zrodlo = zw ? 'ZES' : poz;
      mozeNowy = !zw || poz === 'ZES';
      wiersze = Object.keys(P).filter((k) => P[k].poz === zrodlo && pasuje(k, P[k].nazwa + ' ' + (P[k].dysza || ''))).map((k) => {
        const it = P[k];
        const c = this.kosztPelny(P, k, wariant, mk);

  szczegoly(s, P, poz, wariant, nom, mk, mm, ma, pig, segStyl) {

        wynik: zostaje !== null
          ? 'Z 1 ' + jmF + ' do receptur trafia ' + this.fN(zostaje) + ' ' + jd + (c.ok ? ' · koszt ' + this.jednostkaKosztu(it, c.z) : '')
          : 'Wpisz, ile ' + (it.jedn === 'szt' ? 'sztuk' : it.jedn === 'ml' ? 'mililitrów' : 'gramów') + ' jest w 1 ' + (jmF || 'jednostce') + ' — bez tego surowiec nie wejdzie do kosztu i zużycia.',

          : 'Propozycja z nazwy towaru — sprawdź z etykietą dostawcy i potwierdź. Produkty i zestawy dziedziczą je same.',

    const c = this.kosztPelny(P, it.kod, wariant, mk);

    const mozliwe = (lista) => (it.poz === 'POL' || it.poz === 'PRO' ? ['SUR', 'POL'] : lista === 's' ? ['PRO', 'POL', 'SUR'] : ['OA', 'SUR']);

              dodaj: grupa ? () => this.dodajOpcje(it.kod, lista, grupa.id, k) : () => this.dodaj(it.kod, lista, k) };

        dodaj: () => this.setState({ pk: otwarty ? null : { lista, szukaj: '' } }),

        pkOtwarty: otwarty,
        pkSzukaj: otwarty ? s.pk.szukaj : '',
        pkUstaw: (e) => this.setState({ pk: Object.assign({}, this.state.pk, { lista, szukaj: e.target.value }) }),

      if (it.poz === 'POL') this.rozwin(P, it.kod, podstawa, acc, braki, 0);

        this.rozwin(P, it.kod, 1, acc, braki, 0);
        this.rozwinWiersze(P, this.dodatki(it, wariant), 1, acc, braki, 1);
      }
      const nRaw = s.N[nKlucz] !== undefined ? s.N[nKlucz] : this.fN(nDomyslne, 1);
      const nV = this.liczba(nRaw);
      const N = nV === null ? 0 : nV;
      let razem = 0;
      const wiersze = Object.keys(acc).map((k) => {
        const tw = this.TM[k];
        const ilosc = acc[k];
        const koszt = ilosc * N * (tw.cena || 0);
        razem += koszt;
        return { k, kod: tw.kod, nazwa: tw.nazwa, na1: this.fN(ilosc) + ' ' + (this.JM[tw.jm] || tw.jm), naN: this.fN(ilosc * N) + ' ' + (this.JM[tw.jm] || tw.jm), kosztN: this.zl(koszt), koszt, idz: () => this.idz('TOW', tw.kod, true) };
      }).sort((a, b) => b.koszt - a.koszt);
      const bk = Object.keys(braki);
      return {
        widoczny: true, naEtykieta, nTxt: nRaw, nEtykieta,
        ustawN: (e) => this.setState({ N: Object.assign({}, this.state.N, { [nKlucz]: e.target.value }) }),
        wiersze, razem: this.zl(razem), pusty: wiersze.length === 0,
        maBraki: bk.length > 0, braki: 'Bez przelicznika, poza rozwinięciem: ' + bk.map((k) => this.kodW(k) + ' ' + P[k].nazwa).join(', ')
      };
    };

    if (it.poz === 'POL') {
      d.jestPol = true; d.jestSklad = true;
      d.kod = this.kodW(it.kod); d.poziomNazwa = 'Półprodukt · partia';
      const wej = this.masaWejscia(P, it, mm);
      const szt = it.jedn === 'szt', ml = it.jedn === 'ml';
      const jw = szt ? 'szt.' : it.jedn;          // jednostka partii: g, ml albo szt.
      const duza = ml ? 'l' : 'kg';               // 1000 g = 1 kg, 1000 ml = 1 l
      const ok = ml ? 'ok. ' : '';                // wsad w gramach, a partia w ml — liczę 1 ml ≈ 1 g
      const ubytek = !szt && wej > 0 && it.wych > 0 ? (1 - it.wych / wej) * 100 : null;
      const nomB = nom[it.kod] || 0;
      const c1 = this.koszt(P, it.kod, mk);
      d.kafle = [
        kafel('Z partii wychodzi', this.fN(it.wych) + ' ' + jw, !szt ? 'wsad ' + ok + this.fN(wej) + ' g' : (it.g1 ? 'ok. ' + this.fN(it.g1) + ' g / szt.' : '')),
        kafel('Koszt partii', c1.ok ? this.zl(c1.z * it.wych) : '—', 'surowce bez wody'),
        kafel(szt ? 'Koszt 1 szt.' : 'Koszt 1 ' + duza, c1.ok ? this.zl(szt ? c1.z : c1.z * 1000) : '—', ubytek !== null ? 'ubytek w partii ' + ok + this.fN(ubytek, 1) + '%' : ''),
        kafel('Nominalnie 30 dni', nomB ? (szt ? this.fN(nomB, 0) + ' szt.' : this.fN(nomB / 1000) + ' ' + duza) : '—', nomB ? this.fN(nomB / it.wych, 1) + ' partii' : 'nieużywany w zestawach')
      ];
      d.karty = [karta('s', 'Partia', 'Składniki jednej partii — tak jak na kuchni, z wodą')];
      const kl = it.kod;
      d.pol = {
        wychTxt: s.txt[kl + '|wych'] !== undefined ? s.txt[kl + '|wych'] : this.fN(it.wych, 3),
        ustawWych: (e) => this.poleLiczbowe(kl, 'wych', e.target.value, 0),
        jedn: [['g', 'g'], ['ml', 'ml'], ['szt', 'szt.']].map((j) => ({ etykieta: j[1], wl: it.jedn === j[0], styl: segStyl(it.jedn === j[0]), wybierz: () => this.zmienPoz(kl, (x) => { x.jedn = j[0]; }) })),
        ubytek: ubytek !== null ? 'Wsad ' + ok + this.fN(wej) + ' g → wychodzi ' + this.fN(it.wych) + ' ' + jw + ' · ubytek ' + ok + this.fN(ubytek, 1) + '% (parowanie, obróbka' + (ml ? '; 1 ml ≈ 1 g' : '') + ')' : 'Partia liczona w sztukach — koszt dzieli się na ' + this.fN(it.wych) + ' szt.'
      };
      const naJ = szt ? 1 : 1000;
      d.roz = rozwiniecie(naJ, szt ? nomB : nomB / 1000, szt ? 'szt. w 30 dni (nominalnie)' : duza + ' w 30 dni (nominalnie)', szt ? 'na 1 szt.' : 'na 1 ' + duza);
      d.gdz = gdzie(it.kod);
      return d;
    }

    if (it.poz === 'PRO') {
      d.jestPro = true; d.jestSklad = true;
      d.kod = it.kod; d.poziomNazwa = 'Produkt · na 1 szt.';
      const m = this.masa(P, it.kod, mm);
      const nomB = nom[it.kod] || 0;
      const osobno = this.zestawyZ(it.kod);
      const zo = osobno.length ? P[osobno[0]] : null;
      const co = zo ? this.kosztPelny(P, zo.kod, 'ZES', mk) : null;
      const fc = zo && zo.cena > 0 && co.ok ? co.z / (zo.cena / 1.08) * 100 : null;
      d.kafle = [
        kafel('Kawałki', String(it.kaw || 0), 'w 1 szt. produktu'),
        kafel('Masa', 'ok. ' + this.fN(m, 0) + ' g', 'bez opakowania'),
        kafel('Koszt surowca', c.ok ? this.zl(c.z) : '—', c.ok ? '' : 'uzupełnij dane'),
        kafel('Sprzedaż osobno', zo ? zo.kod : '—', zo ? (fc !== null ? 'food cost ' + this.fN(fc, 1) + '%' : 'bez ceny') : 'tylko w zestawach'),
        kafel('Nominalnie 30 dni', nomB ? this.fN(nomB, 0) + ' szt.' : '—', 'ze sprzedaży zestawów')
      ];
      d.karty = [karta('s', 'Skład na 1 szt.', 'Gramatury surowców i półproduktów')];
      const kl = it.kod;
      d.pro = {
        kawTxt: s.txt[kl + '|kaw'] !== undefined ? s.txt[kl + '|kaw'] : String(it.kaw || 0),
        ustawKaw: (e) => this.poleLiczbowe(kl, 'kaw', e.target.value, 0),
        osobnoOpis: zo ? zo.nazwa + ' · ' + (zo.cena > 0 ? this.zl(zo.cena) : 'bez ceny') + (osobno.length > 1 ? ' · i ' + (osobno.length - 1) + ' inne' : '') : 'Gdy ma się sprzedawać osobno, dostaje zestaw z jednym produktem — wtedy trafia do sklepu i na tablet.',
        osobnoEtykieta: zo ? 'Pokaż ' + zo.kod : '+ Zestaw z 1 produktem',
        osobno: zo ? () => this.idz('ZES', zo.kod, true) : () => this.nowyZestawZ(it.kod)
      };
      d.roz = rozwiniecie(1, nomB, 'szt. w 30 dni (nominalnie)', 'na 1 szt.');
      d.gdz = gdzie(it.kod);
      return d;
    }

    /* zestaw (ZES · PACZ · TAL) */
    d.jestZes = true; d.jestSklad = true;
    if (this.jedenProdukt(it)) d.statusy.push(pig('zestaw z 1 produktem', 'moc'));
    d.kod = poz === 'PACZ' ? 'PACZ-' + it.kod : it.kod;
    d.poziomNazwa = poz === 'PACZ' ? 'Paczka · dowóz i odbiór' : poz === 'TAL' ? 'Talerz · stolik' : 'Zestaw';
    const kw = this.kawalki(P, it.kod);
    const maKaw = kw.baza + kw.gratis > 0;
    const kawTekst = !maKaw ? '—' : kw.gratis ? this.fN(kw.baza, 0) + ' + ' + this.fN(kw.gratis, 0) + ' = ' + this.fN(kw.baza + kw.gratis, 0) + ' szt.' : this.fN(kw.baza, 0) + ' szt.';
    const fc = it.cena > 0 && c.ok ? c.z / (it.cena / 1.08) * 100 : null;
    const np = Math.max(0, (it.n30 || 0) - (it.n30t || 0));
    const nWar = poz === 'PACZ' ? np : poz === 'TAL' ? (it.n30t || 0) : (it.n30 || 0);
    d.kafle = [
      kafel('Kawałki', kawTekst, !maKaw ? 'bez produktów — np. zupa, sos' : kw.gratis ? 'z gratisem' : ''),
      kafel(poz === 'PACZ' ? 'Koszt paczki' : poz === 'TAL' ? 'Koszt talerza' : 'Koszt surowca', c.ok ? this.zl(c.z) : '—', poz === 'ZES' ? 'bez opakowań' : 'w tym dodatki ' + this.zl(c.opak)),
      kafel('Cena', it.cena > 0 ? this.zl(it.cena) : '—', 'brutto · z DYSZY'),
      kafel('Food cost', fc !== null ? this.fN(fc, 1) + '%' : '—', 'od ceny netto (VAT 8%)'),
      kafel('Sprzedaż 30 dni', this.fN(it.n30 || 0, 0) + ' szt.', 'paczka ' + this.fN(np, 0) + ' · talerz ' + this.fN(it.n30t || 0, 0))
    ];
    const karty = [karta('s', 'Skład zestawu', 'Produkty, gratis do wyboru i dodatki')];
    if (poz === 'PACZ') karty.push(karta('pacz', 'Paczka · opakowania i dodatki', 'Do dowozu i odbioru: pudełka, torba, pałeczki, sos w porcjach'));
    if (poz === 'TAL') karty.push(karta('tal', 'Talerz · dodatki przy stoliku', 'Bez opakowań; tylko to, co podaje się przy stole'));
    d.karty = karty;
    const alg = this.alergenyPelne(P, it.kod, wariant, ma);
    const algNie = this.alergenyNiepotwierdzone(P, it.kod, wariant);
    let zgodnosc = null;
    if (it.dysza) {
      const mt = /(\d+)\s*\+\s*(\d+)\s*=\s*(\d+)/.exec(it.dysza);
      const mt2 = /(\d+)\s*szt/i.exec(it.dysza);
      let okN = null;
      if (mt) okN = Number(mt[1]) === Math.round(kw.baza) && Number(mt[2]) === Math.round(kw.gratis) && Number(mt[3]) === Math.round(kw.baza + kw.gratis);
      else if (mt2) okN = Number(mt2[1]) === Math.round(kw.baza + kw.gratis);
      zgodnosc = okN === null ? null : okN ? pig('zgodne z nazwą w DYSZY', 'ok') : pig('inaczej niż w nazwie w DYSZY', 'uw');
    }
    const kl = it.kod;
    d.zes = {
      warianty: [['ZES', 'Zestaw'], ['PACZ', 'Paczka · dowóz i odbiór'], ['TAL', 'Talerz · stolik']].map((p) => ({ etykieta: p[1], wl: poz === p[0], styl: segStyl(poz === p[0]), wybierz: () => this.idz(p[0], kl, false) })),
      dysza: it.dysza || 'nowy — jeszcze nie ma go w DYSZY',
      dyszaTxt: s.txt[kl + '|dysza'] !== undefined ? s.txt[kl + '|dysza'] : (it.dysza || ''),
      ustawDysze: (e) => {
        const raw = e.target.value;
        const v = raw.replace(/\s+/g, ' ').trim() || null;
        const sp = this.sprzedazDla(v);
        this.zmienPoz(kl, (x) => { x.dysza = v; if (sp) { x.n30 = sp.n30; x.n30t = sp.n30t; } }, { [kl + '|dysza']: raw });
      },
      podpowiedzi: this.podpowiedziDyszy(),
      maMoc: this.maMoc(),
      tabletOpis: [maKaw ? kawTekst : '', this.maMoc() ? 'moc ' + (it.moc ? it.moc + ' P' : '— P') : '', 'alergeny: ' + (alg.length ? alg.map((a) => this.ALG[a]).join(', ') : 'brak w danych')].filter(Boolean).join(' · '),
      sklepOpis: [maKaw ? kawTekst : '', 'alergeny: ' + (alg.length ? alg.map((a) => this.ALG[a]).join(', ') : 'brak w danych') + (algNie ? ' (do potwierdzenia: ' + algNie + ' ' + (algNie === 1 ? 'surowiec' : algNie % 10 >= 2 && algNie % 10 <= 4 && (algNie % 100 < 10 || algNie % 100 >= 20) ? 'surowce' : 'surowców') + ')' : '')].filter(Boolean).join(' · '),
      maZgodnosc: !!zgodnosc, zgodnosc: zgodnosc || pig('', 'cicha'),
      kawTekst,
      cenaTxt: s.txt[kl + '|cena'] !== undefined ? s.txt[kl + '|cena'] : (it.cena ? this.f(it.cena, 2) : ''),
      ustawCene: (e) => this.poleLiczbowe(kl, 'cena', e.target.value, 0),
      mocTxt: s.txt[kl + '|moc'] !== undefined ? s.txt[kl + '|moc'] : (it.moc ? String(it.moc) : ''),
      ustawMoc: (e) => this.poleLiczbowe(kl, 'moc', e.target.value, 0),
      kanaly: [['sklep', 'Sklep · psushi.pl'], ['tablet', 'Tablet kelnerki']].map((p) => ({ etykieta: p[1], wl: !!it[p[0]], styl: segStyl(!!it[p[0]]), przelacz: () => this.zmienPoz(kl, (x) => { x[p[0]] = !x[p[0]]; }) })),
      alergeny: (alg.length ? alg.map((a) => this.ALG[a]).join(', ') : 'brak w danych') + (algNie ? ' (do potwierdzenia: ' + algNie + ' ' + (algNie === 1 ? 'surowiec' : algNie % 10 >= 2 && algNie % 10 <= 4 && (algNie % 100 < 10 || algNie % 100 >= 20) ? 'surowce' : 'surowców') + ')' : ''),
      cena: it.cena > 0 ? this.zl(it.cena) : '— zł',
      moc: it.moc ? it.moc + ' P' : '— P',
      wSklepie: !!it.sklep, wTablecie: !!it.tablet, bezSklepu: !it.sklep, bezTabletu: !it.tablet, nigdzie: !it.sklep && !it.tablet
    };
    d.roz = rozwiniecie(1, nWar, poz === 'PACZ' ? 'paczek w 30 dni (DYSZA)' : poz === 'TAL' ? 'talerzy w 30 dni (DYSZA)' : 'zestawów w 30 dni (DYSZA)', poz === 'PACZ' ? 'na 1 paczkę' : poz === 'TAL' ? 'na 1 talerz' : 'na 1 zestaw');
    return d;
  }

  /* ZDZISŁAW-kucharz: jedno zdanie do tego, co widać (pochwała w jego stylu, gdy jest za co) */
  dymekZdz(s, P, poz, wariant, nom, mk) {
    const kod = s.wyb[poz];
    if (s.pk) return 'Dobieram składnik. Szukaj po kodzie albo po nazwie — znam każdy surowiec z FIRMINO i każdy półprodukt.';
    if (poz === 'TOW') {
      const t = this.TM[kod];
      if (!t) return 'Wybierz towar z listy.';
      const sk = this.T2S[t.kod];
      if (!sk) return t.nazwa + ' to nie moja kuchnia. Nie wchodzi do receptur ani do zużycia nominalnego.';
      if (P[sk] && P[sk].poz === 'OA') return t.nazwa + ' jedzie z klientem w paczce. Liczę go w PACZCE, nigdy na talerzu.';
      return t.nazwa + ' przychodzi z FIRMINO w ' + (this.JM[t.jm] || t.jm) + ', a do receptur trafia jako ' + sk + ' — już w gramach.';
    }
    const it = P[kod];
    if (!it) return 'Wybierz pozycję z listy.';
    const w = s.wer[kod];
    if (s.zm[kod]) return it.nowy ? 'Nowa receptura na desce. Dodaj składniki, ustaw gramatury i zapisz — od ' + this.jutro() + ' będzie obowiązywać.' : 'Widzę nowe gramatury. Zapisz — od ' + this.jutro() + ' liczę według wersji ' + ((w ? w.nr : 1) + 1) + ', a minione dni według starej.';
    if (w && w.nr > 1) return 'Wersja ' + w.nr + ' zapisana. Gramatura równa jak szalki o świcie — przyroda by się nie powstydziła.';
    if (this.bazowe(it)) {
      const st = this.statusSur(it);
      const tw = it.tow ? this.TM[it.tow] : null;
      const jmF = tw ? (this.JM[tw.jm] || tw.jm) : '';
      if (st === 'woda') return 'Woda nic nie kosztuje, ale waży. Dlatego partia ryżu wychodzi cięższa niż sam ryż.';
      if (st === 'cen') return it.nazwa + ' nie ma ceny w FIRMINO. Zważę, ale nie wycenię — uzupełnij cenę przy najbliższej fakturze.';
      if (st === 'uzu') return 'Bez przelicznika ' + it.nazwa + ' ucieka mi z wagi. Wpisz, ile gramów, mililitrów albo sztuk jest w 1 ' + jmF + (/\.$/.test(jmF) ? '' : '.');
      if (it.wyd < 100) return 'Z 1 ' + jmF + ' ' + it.nazwa.toLowerCase() + ' do receptur trafia ' + this.fN(it.prz * it.wyd / 100) + ' ' + (it.jedn === 'szt' ? 'szt.' : it.jedn) + '. Resztę zabiera nóż — a ja to pamiętam.';
      return it.nazwa + ': ' + this.fN(it.prz) + ' ' + (it.jedn === 'szt' ? 'szt.' : it.jedn) + ' w 1 ' + jmF + (/\.$/.test(jmF) ? '' : '.') + ' Prosto jak pałeczka.';
    }
    const c = this.kosztPelny(P, kod, wariant, mk);
    if (!c.ok) return 'Coś mi nie waży: ' + c.braki.slice(0, 2).map((k) => (P[k] ? P[k].nazwa : k)).join(', ') + ' bez przelicznika albo ceny. Uzupełnij, a policzę do grosza.';
    if (it.poz === 'POL') {
      if (it.jedn === 'g') {
        const wej = this.masaWejscia(P, it, {});
        return it.nazwa + ': ze wsadu ' + this.fN(wej / 1000) + ' kg wychodzi ' + this.fN(it.wych / 1000) + ' kg. Tę przemianę liczę co do grama.';
      }
      if (it.jedn === 'ml') {
        const wej = this.masaWejscia(P, it, {});
        return it.nazwa + ': ze wsadu ok. ' + this.fN(wej / 1000) + ' kg wychodzi ' + this.fN(it.wych / 1000) + ' l, po ' + this.zl(c.z * 1000) + ' za litr. Odmierzam chochlą, nie na oko.';
      }
      return it.nazwa + ': z partii ' + this.fN(it.wych, 0) + ' szt., po ' + this.zl(c.z) + ' za sztukę. Chrupią nawet w arkuszu.';
    }
    if (it.poz === 'PRO') return it.nazwa + ': ' + (it.kaw || 0) + ' kawałków, ' + this.zl(c.z) + ' surowca. Każdy gram na swoim miejscu, jak nuty w preludium.';
    const fc = it.cena > 0 ? c.z / (it.cena / 1.08) * 100 : null;
    if (poz === 'PACZ') return 'Paczka dokłada ' + this.zl(c.opak) + ' — pudełko też waży, choć nikt go nie je.' + (fc !== null ? ' Razem ' + this.fN(fc, 1) + '% ceny netto.' : '');
    if (poz === 'TAL') return 'Na talerzu bez kartonu: ' + this.zl(c.z) + '. Stolik kocha prostotę.';
    return it.nazwa + ' waży u mnie ' + this.zl(c.z) + ' surowca' + (fc !== null ? ' — ' + this.fN(fc, 1) + '% ceny netto.' : '.') + ' Szalki równe jak horyzont nad Wisłą.';
  }

  masaWejscia(P, it, mm) {
    let g = 0;
    (it.s || []).forEach((w) => { g += w.ile * this.masa(P, w.k, mm); });
    return g;
  }

  jednostkaWiersza(c) {
    if (!c) return '';
    if (c.poz === 'PRO' || c.poz === 'ZES') return '×';
    if (c.poz === 'OA') return 'szt.';
    return c.jedn === 'szt' ? 'szt.' : c.jedn;
  }

  wierszSkladu(s, P, it, lista, w, mk) {
    const klucz = it.kod + '|' + lista + '|' + w.id;
    const ileTxt = s.txt[klucz] !== undefined ? s.txt[klucz] : this.fN(w.ile, 3);
    const wspolne = {
      id: w.id, ileTxt,
      ustawIle: (e) => this.ustawIle(it.kod, lista, w.id, e.target.value),
      usun: () => this.usun(it.kod, lista, w.id)
    };
    if (w.wyb) {
      const n = w.opc.length || 1;
      let z = 0; let okW = true;
      w.opc.forEach((o) => { const co = this.koszt(P, o, mk); z += co.z / n; if (!co.ok) okW = false; });
      return Object.assign(wspolne, {
        kod: 'WYBÓR', nazwa: w.wyb || 'Wybór klienta', opis: w.opc.length ? w.opc.map((o) => (P[o] ? P[o].nazwa : o)).join(' / ') + ' · liczony średnio' : 'bez opcji — stuknij, żeby je dodać',
        jedn: '×', koszt: okW ? this.zl(z * w.ile) : '—', idz: () => this.setState({ pk: { lista, szukaj: '', grupa: w.id } }),
        etykieta: 'Ilość: ' + w.wyb, usunEtykieta: 'Usuń: ' + w.wyb
      });
    }
    const c = P[w.k];
    const cc = this.koszt(P, w.k, mk);
    let opis = '';
    if (c && c.poz === 'PRO') opis = this.fN(w.ile) + ' × ' + (c.kaw || 0) + ' = ' + this.fN(w.ile * (c.kaw || 0), 0) + ' szt.';
    else if (c && c.zero) opis = 'bez kosztu';
    else if (c && this.bazowe(c)) opis = (c.tow || '') + (cc.ok ? ' · ' + this.jednostkaKosztu(c, cc.z) : ' · uzupełnij przelicznik');
    else if (c && c.poz === 'POL') opis = cc.ok ? this.jednostkaKosztu({ jedn: c.jedn }, cc.z) : 'koszt niepełny';
    return Object.assign(wspolne, {
      kod: this.kodW(w.k), nazwa: c ? c.nazwa : w.k, opis,
      jedn: this.jednostkaWiersza(c), koszt: cc.ok ? this.zl(cc.z * w.ile) : '—',
      idz: () => this.idzDoPozycji(w.k),
      etykieta: 'Ilość: ' + (c ? c.nazwa : w.k), usunEtykieta: 'Usuń: ' + (c ? c.nazwa : w.k)
    });
  }
}

function dzienW(d) {

    .formatToParts(d || new Date()).forEach(function (x) { p[x.type] = x.value; });

}
function dodajDni(k, n) { var d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function fmtD(iso) { return iso ? String(iso).slice(8, 10) + '.' + String(iso).slice(5, 7) + '.' + String(iso).slice(0, 4) : ''; }
function fmtDM(iso) { return iso ? String(iso).slice(8, 10) + '.' + String(iso).slice(5, 7) : ''; }

/* CSV z FIRMINO (eksport „Produkty”): średnik, cudzysłowy, nagłówek z nazwami kolumn */
function czytajCsv(tekst) {
  tekst = String(tekst || '').replace(/^﻿/, '');
  var pierwsza = tekst.split(/\r?\n/, 1)[0] || '';
  var sep = (pierwsza.match(/;/g) || []).length >= (pierwsza.match(/,/g) || []).length ? ';' : ',';
  var wiersze = [], w = [], pole = '', cyt = false;
  for (var i = 0; i < tekst.length; i++) {
    var c = tekst[i];
    if (cyt) {
      if (c === '"') { if (tekst[i + 1] === '"') { pole += '"'; i++; } else cyt = false; }
      else pole += c;
    } else if (c === '"') cyt = true;
    else if (c === sep) { w.push(pole); pole = ''; }
    else if (c === '\n') { w.push(pole); wiersze.push(w); w = []; pole = ''; }
    else if (c !== '\r') pole += c;
  }
  if (pole !== '' || w.length) { w.push(pole); wiersze.push(w); }
  var nag = (wiersze[0] || []).map(function (h) { return String(h).toLowerCase().replace(/[\s.]/g, ''); });
  var ix = function (n) { return nag.indexOf(n); };
  var iKod = ix('kod'), iNaz = ix('nazwa'), iJm = ix('jm'), iCena = ix('cenazak'), iVat = ix('vat'), iRodz = ix('rodzaj');
  if (iKod < 0 || iNaz < 0 || iJm < 0 || iCena < 0) throw new Error('To nie wygląda na eksport „Produkty” z FIRMINO — brakuje kolumny Kod, Nazwa, Jm albo Cena zak.');
  var wyn = [], kody = {};
  wiersze.slice(1).forEach(function (r) {
    var kod = String(r[iKod] || '').trim().toUpperCase();
    if (!kod) return;
    var rodz = iRodz >= 0 ? String(r[iRodz] || '').trim() : '';
    if (rodz && rodz.toLowerCase() !== 'towar') return;
    if (kody[kod]) throw new Error('Kod ' + kod + ' powtarza się w pliku — to nie wygląda na eksport z FIRMINO.');
    kody[kod] = true;
    var c = Number(String(r[iCena] || '').replace(/\s| /g, '').replace(',', '.'));
    wyn.push({ kod: kod, nazwa: String(r[iNaz] || '').trim(), jm: String(r[iJm] || '').trim().toUpperCase(), cena: c > 0 ? Math.round(c * 10000) / 10000 : null, vat: iVat >= 0 ? String(r[iVat] || '').trim() : '' });
  });
  if (wyn.length < 50) throw new Error('W pliku jest ' + wyn.length + ' ' + odm(wyn.length, 'towar', 'towary', 'towarów') + ' — to nie cały eksport „Produkty” (trzeba co najmniej 50).');
  return wyn;
}
