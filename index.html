    const d = this.props.dane; const e = d.eksport || {}; const sp = d.sprzedaz || {};
    return 'receptury.dysza.app · wersja ' + WERSJA + ' · towary i ceny zakupu (netto): ' + (e.plik || 'eksport FIRMINO') + (e.wgrano ? ' z ' + fmtD(dzienW(new Date(e.wgrano))) : '')
      + ', ' + this.T.length + ' pozycji · sprzedaż zestawów: DYSZA, ' + fmtD(sp.od) + '–' + fmtD(sp.do) + ' (bez anulowanych) · przeliczniki: automatyczne z jednostek FIRMINO, 13 z PRZELICZNIKI-FIRMINO (29.09) i ustawione w Recepturach · alergeny: propozycje z nazw towarów, w sklepie i na tablecie tylko potwierdzone · każdy zapis to nowa wersja od jutra.';
  }
  mozeWgrac() { return !!(this.props.dane.ja || {}).edycja; }
  maMoc() { return false; }
  zestawyOpis() { return 'w zestawach · 30 dni'; }
  sprzedazDla(nazwa) { return (nazwa && this.SPRZ[klucz(nazwa)]) || { n30: 0, n30t: 0 }; }
  podpowiedziDyszy() { return this.PODP; }
  pokazKomunikat(tekst, rodzaj) {
    clearTimeout(this.__kt);
    super.pokazKomunikat(tekst, rodzaj);
    if (tekst && (rodzaj || 'ok') === 'ok') this.__kt = setTimeout(() => { if (this.state.kom && this.state.kom.tekst === tekst) this.setState({ kom: null }); }, 7000);
  }

  /* ───── zapis wersji ───── */
  sprawdzPrzedZapisem(it) {
    const s = this.state; const P = s.P;
    const pref = it.kod + '|';
    for (const k of Object.keys(s.txt || {})) {
      if (k.indexOf(pref) !== 0 || k === pref + 'dysza' || k.indexOf(pref + 'wyb|') === 0) continue;
      const raw = String(s.txt[k]).trim();
      if (raw === '') { if (k === pref + 'cena') continue; return 'Uzupełnij puste pole z liczbą albo odrzuć zmiany.'; }
      if (this.liczba(raw) === null) return '„' + raw + '” to nie liczba — popraw pole.';
    }
    if (this.bazowe(it)) {
      if (it.prz !== null && it.prz !== undefined && !it.jedn) return 'Wybierz jednostkę przelicznika: g, ml albo szt.';
      if (!(it.prz > 0) && it.prz !== null && it.prz !== undefined) return 'Przelicznik musi być większy od zera.';
      if (it.poz === 'SUR' && !(it.wyd > 0 && it.wyd <= 100)) return 'Wydajność musi być od 1 do 100%.';
      return null;
    }
    if (!String(it.nazwa || '').trim()) return 'Wpisz nazwę.';
    if (it.poz === 'POL' && !(it.wych > 0)) return 'Wpisz, ile wychodzi z partii.';
    if (it.poz === 'PRO' && !(it.kaw >= 1 && Math.round(it.kaw) === it.kaw)) return 'Liczba kawałków musi być liczbą całkowitą od 1.';
    if (it.poz === 'ZES' && s.txt[pref + 'cena'] === undefined && it.cena !== null && !(it.cena > 0)) return 'Cena musi być większa od zera.';
    const listy = it.poz === 'ZES' ? ['s', 'pacz', 'tal'] : ['s'];
    for (const l of listy) {
      for (const w of (it[l] || [])) {
        if (!(w.ile > 0)) return 'Ilość w składzie musi być większa od zera.';
        if (w.wyb && !w.opc.length) return 'Wybór klienta „' + (String(w.wyb || '').trim() || 'bez nazwy') + '” nie ma opcji — dodaj co najmniej jedną albo usuń wybór.';
        for (const k of (w.wyb ? w.opc : [w.k])) {
          if (!P[k]) return 'Składnika ' + this.kodW(k) + ' nie ma na liście.';
          if (P[k].nowy) return 'Najpierw zapisz ' + this.kodW(k) + ' (' + P[k].nazwa + ') — to jeszcze szkic.';
        }
      }
    }
    return null;
  }

  doBazy(it) {
    const s = this.state;
    const wiersze = (l) => (it[l] || []).map((w) => (w.wyb ? { wyb: w.wyb, ile: w.ile, opc: w.opc.slice() } : [w.k, w.ile]));
    if (this.bazowe(it)) {
      return { jm: it.jedn || null, przelicznik: it.prz === undefined ? null : it.prz, g1: it.g1 === undefined ? null : it.g1,
        wydajnosc: it.poz === 'SUR' ? it.wyd : null, alergeny: (it.alg || []).slice(), alergeny_ok: !!it.algOk };
    }
    const nazwa = String(it.nazwa || '').trim();
    if (it.poz === 'POL') return { nazwa, jm: it.jedn, wych: it.wych, g1: it.g1 || null, sklad: wiersze('s') };
    if (it.poz === 'PRO') return { nazwa, kawalki: it.kaw, sklad: wiersze('s') };
    const cenaPusta = s.txt[it.kod + '|cena'] !== undefined && String(s.txt[it.kod + '|cena']).trim() === '';
    return { nazwa, cena: cenaPusta ? null : it.cena, vat: it.vat === null || it.vat === undefined ? this.VAT_ZES : it.vat, nazwa_dysza: it.dysza || null,
      sklep: !!it.sklep, tablet: !!it.tablet, sklad: wiersze('s'), pacz: wiersze('pacz'), tal: wiersze('tal') };
  }

  zapisz(kod) {
    const s = this.state; const it = s.P[kod];
    if (!it || s.zapisuje) return;
    if (!(this.props.dane.ja || {}).edycja) { this.pokazKomunikat('Zapisuje Dyrektor Produkcji — tutaj masz podgląd.', 'uw'); return; }
    const blad = this.sprawdzPrzedZapisem(it);
    if (blad) { this.pokazKomunikat(blad, 'uw'); return; }
    const dane = this.doBazy(it);
    this.setState({ zapisuje: kod, cofPotw: null });
    this.props.app.rpc('receptury_zapisz', { p_kod: it.nowy ? null : kod, p_poziom: it.poz, p_dane: dane })
      .then((r) => this.poZapisie(kod, r))
      .catch((e) => { this.setState({ zapisuje: null }); this.props.app.blad(e, 'zapis'); });
  }

  przemianuj(stary, nowy, st) {
    const zmien = (x) => (x === stary ? nowy : x);
    const P = {};
    Object.keys(st.P).forEach((k) => {
      let it = st.P[k];
      if (!this.bazowe(it) && ['s', 'pacz', 'tal'].some((l) => (it[l] || []).some((w) => (w.wyb ? w.opc.indexOf(stary) >= 0 : w.k === stary)))) {
        it = this.kopia(it);
        ['s', 'pacz', 'tal'].forEach((l) => { (it[l] || []).forEach((w) => { if (w.wyb) w.opc = w.opc.map(zmien); else w.k = zmien(w.k); }); });
      }
      P[zmien(k)] = it;
    });
    st.P = P;
    ['zap', 'zm', 'wer'].forEach((pole) => { if (st[pole] && st[pole][stary] !== undefined) { st[pole][nowy] = st[pole][stary]; delete st[pole][stary]; } });
    Object.keys(st.wyb).forEach((k) => { st.wyb[k] = zmien(st.wyb[k]); });
    st.hist = st.hist.map((h) => ({ poz: h.poz, kod: zmien(h.kod) }));
  }

  poZapisie(lok, r) {
    const s = this.state;
    const st = { P: Object.assign({}, s.P), zap: Object.assign({}, s.zap), zm: Object.assign({}, s.zm), wer: Object.assign({}, s.wer),
      txt: Object.assign({}, s.txt), wyb: Object.assign({}, s.wyb), hist: s.hist.slice(), zapisuje: null, cofPotw: null };
    const it = st.P[lok];
    const stara = s.wer[lok] || { nr: 0, od: '' };
    Object.keys(st.txt).forEach((k) => { if (k.indexOf(lok + '|') === 0) delete st.txt[k]; });
    const kod = r.kod;
    if (kod !== lok) this.przemianuj(lok, kod, st);
    let nid = s.nId || 0;
    const p = { kod, poziom: it.poz, towar: it.tow || null, nazwa: this.bazowe(it) ? it.nazwa : String(it.nazwa || '').trim(), aktywna: it.akt !== false };
    st.P[kod] = this.zWersji(p, r.wersja, () => ++nid);
    st.nId = nid;
    st.zap[kod] = this.kopia(st.P[kod]);
    st.zm[kod] = false;
    st.wer[kod] = { nr: r.nr, od: fmtD(r.od), hist: [], zapl: true,
      dzisNr: stara.zapl ? stara.dzisNr : (stara.nr || null), dzisOd: stara.zapl ? stara.dzisOd : (stara.od || ''), kto: (r.wersja && r.wersja.kto) || '' };
    this.setState(st);
    const popr = stara.zapl && stara.nr === r.nr;
    this.pokazKomunikat((r.nowy ? 'Nowa pozycja ' + this.kodW(kod) + ': wersja 1 od ' : popr ? 'Poprawiono wersję ' + r.nr + ' od ' : 'Zapisano wersję ' + r.nr + ' od ') + fmtD(r.od) + '.', 'ok');
  }

  cofnij(kod) {
    const s = this.state; const it = s.P[kod];
    if (!it || s.zapisuje) return;
    const stara = s.wer[kod] || {};
    this.setState({ zapisuje: kod, cofPotw: null });
    this.props.app.rpc('receptury_cofnij', { p_kod: kod }).then((r) => {
      const t = this.state;
      const st = { P: Object.assign({}, t.P), zap: Object.assign({}, t.zap), zm: Object.assign({}, t.zm), wer: Object.assign({}, t.wer), wyb: Object.assign({}, t.wyb), zapisuje: null };
      if (r.usunieta) {
        delete st.P[kod]; delete st.zap[kod]; delete st.zm[kod]; delete st.wer[kod];
        Object.keys(st.wyb).forEach((k) => { if (st.wyb[k] === kod) st.wyb[k] = null; });
        st.hist = t.hist.filter((h) => h.kod !== kod);
        this.setState(st);
        this.pokazKomunikat('Wycofano — ' + this.kodW(kod) + ' nie miała innej wersji, więc zniknęła z listy.', 'ok');
        return;
      }
      let nid = t.nId || 0;
      const p = { kod, poziom: it.poz, towar: it.tow || null, nazwa: it.nazwa, aktywna: it.akt !== false };
      if (r.wersja) {
        st.P[kod] = this.zWersji(p, r.wersja, () => ++nid);
        st.wer[kod] = { nr: r.wersja.nr, od: fmtD(r.wersja.od), hist: [], zapl: false, kto: r.wersja.kto || '' };
      } else st.wer[kod] = { nr: 0, od: '', hist: [] };
      st.nId = nid;
      st.zap[kod] = this.kopia(st.P[kod]);
      st.zm[kod] = false;
      this.setState(st);
      this.pokazKomunikat('Wycofano wersję ' + stara.nr + (r.wersja ? ' — obowiązuje wersja ' + r.wersja.nr + ' od ' + fmtD(r.wersja.od) + '.' : '.'), 'ok');
    }).catch((e) => { this.setState({ zapisuje: null }); this.props.app.blad(e, 'zapis'); });
  }

  /* ───── wgranie eksportu „Produkty” z FIRMINO ───── */
  wgraj(e) {
    const pole = e && e.target;
    const plik = pole && pole.files && pole.files[0];
    if (pole) pole.value = '';
    if (!plik || this.state.wgrywa) return;
    if (this.maZmiany()) { this.pokazKomunikat('Najpierw zapisz albo odrzuć zmiany w recepturach — po wgraniu strona wczyta wszystko od nowa.', 'uw'); return; }
    plik.arrayBuffer().then((buf) => {
      let tekst;
      try { tekst = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (x) { tekst = new TextDecoder('windows-1250').decode(buf); }
      const w = czytajCsv(tekst);
      let nowe = 0; let ceny = 0;
      const wPliku = {};
      w.forEach((x) => {
        wPliku[x.kod] = true;
        const t = this.TM[x.kod];
        if (!t) nowe += 1;
        else if (Math.abs((Number(t.cena) || 0) - (x.cena || 0)) > 0.00005) ceny += 1;
      });
      const znikna = this.T.filter((t) => t.akt !== false && !wPliku[t.kod]).length;
      const tekstP = plik.name + ': ' + w.length + ' ' + odm(w.length, 'towar', 'towary', 'towarów') + ' · nowe: ' + nowe + ' · zmienione ceny: ' + ceny + ' · znikną z eksportu: ' + znikna
        + '. Ceny zakupu w recepturach zmienią się od razu, a nowe towary z grup surowców i opakowań trafią do receptur. Wgrać?';
      this.setState({ wg: { plik: plik.name, wiersze: w, tekst: tekstP, tak: 'Wgraj ' + w.length + ' ' + odm(w.length, 'towar', 'towary', 'towarów') } });
    }).catch((x) => this.pokazKomunikat(tekstBledu(x), 'bl'));
  }

  wgrajTak() {
    const wg = this.state.wg;
    if (!wg || this.state.wgrywa) return;
    this.setState({ wg: null, wgrywa: true });
    this.props.app.rpc('firmino_towary_wgraj', { p_plik: wg.plik, p_wiersze: wg.wiersze })
      .then((r) => this.props.app.przeladuj().then(() => {
        this.setState({ wgrywa: false });
        this.pokazKomunikat('Wgrano ' + wg.plik + ': ' + r.wierszy + ' ' + odm(r.wierszy, 'towar', 'towary', 'towarów') + ' · nowe: ' + r.nowe + ' · zmienione: ' + r.zmienione + ' · zniknęło z eksportu: ' + r.znikniete + '.', 'ok');
      }))
      .catch((e) => { this.setState({ wgrywa: false }); this.props.app.blad(e, 'wgranie'); });
  }
}

/* ───────────── motyw ───────────── */
function zastosujMotyw(ciemny) {
  if (ciemny === null || ciemny === undefined) {
    try { ciemny = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { ciemny = false; }
  }
  var r = document.documentElement;
  r.classList.toggle('ciemny', !!ciemny);
  r.classList.toggle('jasny', !ciemny);
  r.style.background = ciemny ? '#0B0F0D' : '#F3F6F4';
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', ciemny ? '#0B0F0D' : '#F3F6F4');
}
function motywTeraz() {
  var m = czytaj(KL.motyw, null);
  if (m === 'ciemny' || m === 'jasny') return m;
  try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'ciemny' : 'jasny'; } catch (e) { return 'jasny'; }
}

/* ───────────── aplikacja: logowanie, start, wylogowanie ───────────── */
var baza = polaczenie(URL_BAZY, KLUCZ);
var korzen = document.getElementById('app');
var szablon = document.getElementById('szablon');
var komp = null, silnik = null, ostatniPin = 0, wylogujPotw = 0;

function osobyUrz() {
  var t = czytaj(KL.osoby, []), gr = Date.now() - 60 * 864e5;
  return (Array.isArray(t) ? t : []).filter(function (o) { return o && o.login && (o.ostatnio || 0) > gr; })
    .sort(function (a, b) { return (b.ostatnio || 0) - (a.ostatnio || 0); });
}
function zapamietajOsobe(o) {
  var n = osobyUrz().filter(function (x) { return x.login.toLowerCase() !== String(o.login).toLowerCase(); });
  n.unshift({ login: o.login, imie: o.imie || o.login, podpis: o.podpis || '', dl: o.dl || 8, ostatnio: Date.now() });
  pisz(KL.osoby, n.slice(0, 12));
}
function zapomnijOsobe(login) { pisz(KL.osoby, osobyUrz().filter(function (x) { return x.login !== login; })); }

var okno = window.DyszaWejscie.utworz({
  modul: 'receptury', nazwa: 'RECEPTURY',
  opis: 'Pracownia Sushi · receptury od FIRMINO do klienta',
  kto: 'Kto się loguje?', inna: '+ Inna osoba', etykietaLogin: 'Login',
  pomoc: 'Login z karty — ten sam co w managerze. Wielkość liter nie ma znaczenia.',
  dalej: 'Dalej', wpiszPin: 'Wpisz PIN', podpowiedzPin: 'PIN ma 8 cyfr.',
  zdzKafelki: 'Ważę tu każdą recepturę — od towaru z FIRMINO po zestaw u klienta. Stuknij swój kafelek — PIN wpiszesz za chwilę.',
  zdzLogin: 'Do Receptur wchodzą osoby z dostępem w managerze. Wpisz login, potem PIN — ja w tym czasie płuczę ryż.',
  pokaz: false, edycja: true,
  osoby: function () { return osobyUrz().map(function (o) { return { login: o.login, imie: o.imie || o.login, podpis: o.podpis || '', dl: o.dl || 8 }; }); },
  zapomnij: zapomnijOsobe,
  prosba: function (login) { return baza.prosba(login); },
  motyw: function () { return motywTeraz(); },
  ustawMotyw: function (m) { pisz(KL.motyw, m === 'ciemny' ? 'ciemny' : 'jasny'); zastosujMotyw(m === 'ciemny'); if (komp) komp.setState({ ciemny: m === 'ciemny' }); },
  zaloguj: function (osoba, pin) { return zalogujWejscie(osoba, pin); }
});

async function zalogujWejscie(osoba, pin) {
  var j = await baza.zaloguj(osoba.login, pin);
  if (j.stary) {
    await baza.wyloguj();
    throw new Error(j.nowy_login ? 'To login ze starej aplikacji. Twój login: ' + j.nowy_login + ' (PIN z managera).'
      : 'To login ze starej aplikacji — Receptury działają z kontem z manager.dysza.app.');
  }
  ostatniPin = pin.length;
  await start(true);
}

function pokazLogowanie(komunikat) {
  var ost = osobyUrz()[0];
  if (komunikat && /^Sesja wygasła/.test(komunikat) && ost) okno.pokaz({ krok: 'pin', osoba: { login: ost.login, imie: ost.imie, dl: ost.dl || 8 }, komunikat: komunikat });
  else okno.pokaz(komunikat ? { komunikat: komunikat, rodzaj: /^Wylogowano/.test(komunikat) ? 'info' : 'blad' } : {});
}

function ekran(tekst, zPrzyciskiem) {
  if (silnik) { silnik.odmontuj(); silnik = null; komp = null; }
  korzen.innerHTML = '<div class="ekran"><p></p>' + (zPrzyciskiem ? '<button type="button">Spróbuj jeszcze raz</button>' : '') + '</div>';
  korzen.querySelector('p').textContent = tekst;
  var b = korzen.querySelector('button');
  if (b) b.addEventListener('click', function () { start(false); });
}

async function pobierz() { return baza.rpc('receptury_start', {}); }

async function start(zLogowania) {
  if (!baza.sesja()) { if (!komp) ekran(''); pokazLogowanie(''); return; }
  if (!komp) ekran('Wczytuję receptury…');
  var d;
  try { d = await pobierz(); }
  catch (e) {
    if (e && e.sesja) { if (zLogowania) throw e; pokazLogowanie('Sesja wygasła — zaloguj się ponownie.'); return; }
    if (String(e && e.message) === 'BRAK_DOSTEPU') {
      await baza.wyloguj();
      if (zLogowania) throw new Error(tekstBledu(e));
      if (komp) ekran('');
      pokazLogowanie(tekstBledu(e)); return;
    }
    if (zLogowania) throw e;
    if (komp) { komp.pokazKomunikat(tekstBledu(e), 'bl'); return; }
    ekran(tekstBledu(e), true); return;
  }
  var ja = d.ja || {};
  var login = ja.login || (baza.sesja() && baza.sesja().login) || '';
  var dawna = osobyUrz().filter(function (x) { return x.login.toLowerCase() === String(login).toLowerCase(); })[0];
  if (login) zapamietajOsobe({ login: login, imie: ja.imie, podpis: ja.architekt ? 'Architekt' : ja.rola === 'dyrektor' ? 'Dyrektor Produkcji' : '', dl: ostatniPin || (dawna && dawna.dl) || 8 });
  ostatniPin = 0;
  okno.ukryj();
  if (komp && komp.props.dane.ja && komp.props.dane.ja.id === ja.id) {
    // ta sama osoba po ponownym zalogowaniu: zmiany na ekranie zostają
    komp.props.dane.ja = ja;
    komp.pokazKomunikat('Zalogowano ponownie — możesz zapisać jeszcze raz.', 'ok');
    return;
  }
  montuj(d);
}

function montuj(d) {
  if (silnik) { silnik.odmontuj(); silnik = null; }
  korzen.textContent = '';
  var m = czytaj(KL.motyw, null);
  komp = new Receptury({ dane: d, app: app, widok: czytaj(KL.widok, null), motyw: m });
  zastosujMotyw(komp.state.ciemny);
  silnik = Silnik.zamontuj(korzen, szablon, komp, { blad: bladRenderu });
}

function bladRenderu(e) {
  if (window.console) console.error(e);
  ekran('Coś się zacięło na ekranie: ' + String((e && e.message) || e) + '. Odśwież stronę — zapisane receptury są w bazie.', true);
}

async function wyloguj() {
  if (komp && komp.maZmiany() && Date.now() - wylogujPotw > 8000) {
    wylogujPotw = Date.now();
    komp.pokazKomunikat('Masz niezapisane zmiany. Zapisz je albo stuknij „Wyloguj” jeszcze raz, by wyjść bez zapisu.', 'uw');
    return;
  }
  wylogujPotw = 0;
  await baza.wyloguj();
  ekran('');
  pokazLogowanie('Wylogowano.');
}

var app = {
  rpc: function (n, a) { return baza.rpc(n, a); },
  wyloguj: wyloguj,
  przeladuj: function () { return pobierz().then(function (d) { if (komp) komp.przeladuj(d); }); },
  blad: function (e, gdzie) {
    if (e && e.sesja) { pokazLogowanie('Sesja wygasła — zaloguj się ponownie.'); return; }
    if (komp) komp.pokazKomunikat(tekstBledu(e, gdzie), e && e.siec ? 'uw' : 'bl');
  }
};

window.addEventListener('beforeunload', function (e) { if (komp && komp.maZmiany()) { e.preventDefault(); e.returnValue = ''; } });
zastosujMotyw(czytaj(KL.motyw, null) === 'ciemny' ? true : czytaj(KL.motyw, null) === 'jasny' ? false : null);
start(false);
